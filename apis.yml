- aid: jira:jira-issue-notification-schemes-api
  name: Jira Issue notification schemes API
  description: "This resource represents notification schemes, lists of events and the recipients who\
    \ will receive notifications for those events. Use it to get details of a notification scheme and\
    \ a list of notification schemes.\n\n### About notification schemes ###\n\nA notification scheme is\
    \ a list of events and recipients who will receive notifications for those events. The list is contained\
    \ within the `notificationSchemeEvents` object and contains pairs of `events` and `notifications`:\n\
    \n *  `event` Identifies the type of event. The events can be [Jira system events](https://support.atlassian.com/jira-cloud-administration/docs/configure-notification-schemes/)\
    \ (see the *Events* section) or [custom events](https://support.atlassian.com/jira-cloud-administration/docs/add-a-custom-event/).\n\
    \ *  `notifications` Identifies the [recipients](https://confluence.atlassian.com/x/8YdKLg#Creatinganotificationscheme-recipientsRecipients)\
    \ of notifications for each event. Recipients can be any of the following types:\n    \n     *  `CurrentAssignee`\n\
    \     *  `Reporter`\n     *  `CurrentUser`\n     *  `ProjectLead`\n     *  `ComponentLead`\n     *\
    \  `User` (the `parameter` is the user key)\n     *  `Group` (the `parameter` is the group name)\n\
    \     *  `ProjectRole` (the `parameter` is the project role ID)\n     *  `EmailAddress` *(deprecated)*\n\
    \     *  `AllWatchers`\n     *  `UserCustomField` (the `parameter` is the ID of the custom field)\n\
    \     *  `GroupCustomField`(the `parameter` is the ID of the custom field)"
  humanURL: https://developer.atlassian.com/cloud/jira/platform/rest/v2/intro/
  baseURL: https://your-domain.atlassian.net/rest/api/2
  tags:
  - Issue notification schemes
  properties:
  - type: OpenAPI
    url: openapi/jira-issue-notification-schemes-api-openapi.yml
  - type: Documentation
