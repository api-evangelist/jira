openapi: 3.2.0
info:
  title: Jira Issues API
  x-refined-note:
  - x-atlassian-api-version differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Issues across 2 of this provider''s published API definitions: jira-cloud-platform-rest-api-openapi.yml, jira-platform-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{domain}.atlassian.net/rest/api/3
  description: Jira Cloud instance
  variables:
    domain:
      description: Your Jira Cloud site subdomain (e.g., your-company).
      default: your-domain
- url: https://your-domain.atlassian.net
tags:
- name: Issues
  description: Create, read, update, delete, and transition Jira issues.
  externalDocs:
    description: Jira Issues REST API documentation
    url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issues/
paths:
  /issue:
    post:
      summary: Jira Create Issue
      description: Creates an issue or a sub-task from a JSON representation. The fields that can be set on an issue depend on the connected Jira instance configuration, the project, and the issue type. You can determine appropriate field values using the Create Issue Metadata endpoint.
      operationId: createIssue
      tags:
      - Issues
      externalDocs:
        description: API method documentation
        url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issues/#api-rest-api-3-issue-post
      parameters:
      - name: updateHistory
        in: query
        description: Whether the project in which the issue is created is added to the user's Recently viewed project list, as shown under Projects in Jira.
        required: false
        schema:
          type: boolean
          default: false
        example: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreateRequest'
            example:
              fields:
                project:
                  key: PROJ
                summary: Main order flow fails when item is sold out
                description:
                  type: doc
                  version: 1
                  content:
                  - type: paragraph
                    content:
                    - type: text
                      text: Order flow errors when an item is sold out.
                issuetype:
                  name: Bug
                priority:
                  name: High
                labels:
                - bugfix
                - production
                assignee:
                  accountId: 5b10a2844c20165700ede21g
      responses:
        '201':
          description: Issue created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedIssue'
              examples:
                Createissue201Example:
                  summary: Default createIssue 201 response
                  x-microcks-default: true
                  value:
                    id: abc123
                    key: example_value
                    self: https://www.example.com
                    transition:
                      status: 10
                      errorCollection:
                        errorMessages: {}
                        errors: example_value
                        status: 10
        '400':
          description: The input is invalid, including if the request body is missing or has invalid fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
              examples:
                Createissue400Example:
                  summary: Default createIssue 400 response
                  x-microcks-default: true
                  value:
                    errorMessages:
                    - example_value
                    errors: example_value
                    status: 10
        '401':
          description: Authentication credentials are missing or invalid.
        '403':
          description: The user does not have permission to create issues in the project.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oauth2: []
      - bearerAuth: []
    servers:
    - url: https://{domain}.atlassian.net/rest/api/3
      description: Jira Cloud instance
      variables:
        domain:
          description: Your Jira Cloud site subdomain (e.g., your-company).
          default: your-domain
  /issue/{issueIdOrKey}:
    get:
      summary: Jira Get Issue
      description: Returns the details for an issue. The issue is identified by its ID or key. The returned issue includes all fields, comment count, names, schema, transitions, editmeta, changelog, and rendered fields.
      operationId: getIssue
      tags:
      - Issues
      externalDocs:
        description: API method documentation
        url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issues/#api-rest-api-3-issue-issueidorkey-get
      parameters:
      - $ref: '#/components/parameters/issueIdOrKey'
      - name: fields
        in: query
        description: A list of fields to return for the issue. Use it to retrieve a subset of fields. Allowed values include any field name, *all for all fields, *navigable for navigable fields.
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        example: []
      - name: expand
        in: query
        description: 'Use expand to include additional information in the response. Accepted values: renderedFields, names, schema, transitions, operations, editmeta, changelog, versionedRepresentations, fields.'
        required: false
        schema:
          type: string
        example: example_value
      - name: properties
        in: query
        description: A list of issue properties to return for the issue. By default no properties are returned.
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        example: []
      - name: fieldsByKeys
        in: query
        description: Whether fields in fields are referenced by keys rather than IDs.
        required: false
        schema:
          type: boolean
          default: false
        example: true
      responses:
        '200':
          description: Issue details returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueBean'
              examples:
                Getissue200Example:
                  summary: Default getIssue 200 response
                  x-microcks-default: true
                  value:
                    id: abc123
                    key: example_value
                    self: https://www.example.com
                    expand: example_value
                    fields:
                      summary: example_value
                      description: A sample description.
                      assignee: example_value
                      labels:
                      - {}
                      components:
                      - {}
                      fixVersions:
                      - {}
                      versions:
                      - {}
                      resolution: example_value
                      resolutiondate: '2026-01-15T10:30:00Z'
                      created: '2026-01-15T10:30:00Z'
                      updated: '2026-01-15T10:30:00Z'
                      duedate: '2026-01-15'
                      subtasks:
                      - {}
                      parent: example_value
                      environment: example_value
                      attachment:
                      - {}
                      issuelinks:
                      - {}
                    renderedFields: example_value
                    names: example_value
                    schema: example_value
                    transitions:
                    - id: abc123
                      name: Example Title
                      hasScreen: true
                      isGlobal: true
                      isInitial: true
                      isConditional: true
                      fields: example_value
                    changelog:
                      startAt: 10
                      maxResults: 10
                      total: 10
                      histories:
                      - {}
        '401':
          description: Authentication credentials are missing or invalid.
        '404':
          description: The issue was not found or the user does not have permission to view it.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oauth2: []
      - bearerAuth: []
    put:
      summary: Jira Edit Issue
      description: Edits an issue. A transition may be applied and issue properties updated as part of the edit. The editable fields depend on the connected Jira instance configuration, the project, and the issue type.
      operationId: editIssue
      tags:
      - Issues
      externalDocs:
        description: API method documentation
        url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issues/#api-rest-api-3-issue-issueidorkey-put
      parameters:
      - $ref: '#/components/parameters/issueIdOrKey'
      - name: notifyUsers
        in: query
        description: Whether a notification email about the issue update is sent to all watchers. Requires administer Jira global permission.
        required: false
        schema:
          type: boolean
          default: true
        example: true
      - name: overrideScreenSecurity
        in: query
        description: Whether screen security is overridden to enable hidden fields to be edited. Requires administer Jira global permission.
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - name: overrideEditableFlag
        in: query
        description: Whether the non-editable flag is overridden to enable uneditable fields to be edited. Requires administer Jira global permission.
        required: false
        schema:
          type: boolean
          default: false
        example: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdateRequest'
            examples:
              EditissueRequestExample:
                summary: Default editIssue request
                x-microcks-default: true
                value:
                  update: example_value
                  fields: example_value
                  transition:
                    id: abc123
                  historyMetadata: example_value
                  properties:
                  - key: example_value
                    value: example_value
      responses:
        '204':
          description: Issue updated successfully.
        '400':
          description: The input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
              examples:
                Editissue400Example:
                  summary: Default editIssue 400 response
                  x-microcks-default: true
                  value:
                    errorMessages:
                    - example_value
                    errors: example_value
                    status: 10
        '401':
          description: Authentication credentials are missing or invalid.
        '403':
          description: The user does not have permission to edit the issue.
        '404':
          description: The issue was not found or the user does not have permission to view it.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oauth2: []
      - bearerAuth: []
    delete:
      summary: Jira Delete Issue
      description: Deletes an issue. An issue can only be deleted if it has no sub-tasks, unless deleteSubtasks is set to true.
      operationId: deleteIssue
      tags:
      - Issues
      externalDocs:
        description: API method documentation
        url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issues/#api-rest-api-3-issue-issueidorkey-delete
      parameters:
      - $ref: '#/components/parameters/issueIdOrKey'
      - name: deleteSubtasks
        in: query
        description: Whether the issue's sub-tasks are also deleted.
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
        example: 'true'
      responses:
        '204':
          description: Issue deleted successfully.
        '400':
          description: The issue has sub-tasks and deleteSubtasks is not set to true.
        '401':
          description: Authentication credentials are missing or invalid.
        '403':
          description: The user does not have permission to delete the issue.
        '404':
          description: The issue was not found or the user does not have permission to view it.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oauth2: []
      - bearerAuth: []
    servers:
    - url: https://{domain}.atlassian.net/rest/api/3
      description: Jira Cloud instance
      variables:
        domain:
          description: Your Jira Cloud site subdomain (e.g., your-company).
          default: your-domain
  /rest/api/3/changelog/bulkfetch:
    post:
      deprecated: false
      description: 'Bulk fetch changelogs for multiple issues and filter by fields


        Returns a paginated list of all changelogs for given issues sorted by changelog date and issue IDs, starting from the oldest changelog and smallest issue ID.


        Issues are identified by their ID or key, and optionally changelogs can be filtered by their field IDs. You can request the changelogs of up to 1000 issues and can filter them by up to 10 field IDs.


        **Permissions required:**


        * *Browse projects* project permission for the projects that the issues are in.

        * If issue-level security is configured, issue-level security permission to view the issues.'
      operationId: getBulkChangelogs
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkChangelogRequestBean'
        description: A JSON object containing the bulk fetch changelog request filters such as issue IDs and field IDs.
        required: true
      responses:
        '200':
          content:
            application/json:
              example: '{"issueChangeLogs":[{"changeHistories":[{"author":{"accountId":"5b10a2844c20165700ede21g","active":true,"avatarUrls":{"16x16":"https://avatar-management--avatars.server-location.prod.public.atl-paas.net/initials/MK-5.png?size=16&s=16","24x24":"https://avatar-management--avatars.server-location.prod.public.atl-paas.net/initials/MK-5.png?size=24&s=24","32x32":"https://avatar-management--avatars.server-location.prod.public.atl-paas.net/initials/MK-5.png?size=32&s=32","48x48":"https://avatar-management--avatars.server-location.prod.public.atl-paas.net/initials/MK-5.png?size=48&s=48"},"displayName":"Mia Krystof","emailAddress":"mia@example.com","self":"https://your-domain.atlassian.net/rest/api/3/user?accountId=5b10a2844c20165700ede21g","timeZone":"Australia/Sydney"},"created":1492070429,"id":"10001","items":[{"field":"fields","fieldId":"fieldId","fieldtype":"jira","fromString":"old summary","toString":"new summary"}]},{"author":{"accountId":"5b10a2844c20165700ede21g","active":true,"avatarUrls":{"16x16":"https://avatar-management--avatars.server-location.prod.public.atl-paas.net/initials/MK-5.png?size=16&s=16","24x24":"https://avatar-management--avatars.server-location.prod.public.atl-paas.net/initials/MK-5.png?size=24&s=24","32x32":"https://avatar-management--avatars.server-location.prod.public.atl-paas.net/initials/MK-5.png?size=32&s=32","48x48":"https://avatar-management--avatars.server-location.prod.public.atl-paas.net/initials/MK-5.png?size=48&s=48"},"displayName":"Mia Krystof","emailAddress":"mia@example.com","self":"https://your-domain.atlassian.net/rest/api/3/user?accountId=5b10a2844c20165700ede21g","timeZone":"Australia/Sydney"},"created":1492071429,"id":"10002","items":[{"field":"fields","fieldId":"fieldId","fieldtype":"jira","fromString":"old summary 2","toString":"new summary 2"}]}],"issueId":"10100"}],"nextPageToken":"UxAQBFRF"}'
              schema:
                $ref: '#/components/schemas/BulkChangelogResponseBean'
          description: Returned if the request is successful.
        '400':
          description: Returned if there are input validation problems such as no issue IDs/keys were present, or more than 1000 issue IDs/keys were requested.
      security:
      - basicAuth: []
      - OAuth2:
        - read:jira-work
      summary: Bulk fetch changelogs
      tags:
      - Issues
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - read:jira-work
        state: Current
      - scheme: OAuth2
        scopes:
        - read:issue-meta:jira
        - read:avatar:jira
        - read:issue.changelog:jira
        state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
    servers:
    - url: https://your-domain.atlassian.net
  /rest/api/3/events:
    get:
      deprecated: false
      description: 'Returns all issue events.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: getEvents
      parameters: []
      responses:
        '200':
          content:
            application/json:
              example: '[{"id":1,"name":"Issue Created"},{"id":2,"name":"Issue Updated"}]'
              schema:
                items:
                  $ref: '#/components/schemas/IssueEvent'
                type: array
          description: Returned if the request is successful.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: Returned if the user does not have permission to complete this request.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Get events
      tags:
      - Issues
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - read:issue-event:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: ADMIN
    servers:
    - url: https://your-domain.atlassian.net
  /rest/api/3/issue:
    post:
      deprecated: false
      description: 'Creates an issue or, where the option to create subtasks is enabled in Jira, a subtask. A transition may be applied, to move the issue or subtask to a workflow step other than the default start step, and issue properties set.


        The content of the issue or subtask is defined using `update` and `fields`. The fields that can be set in the issue or subtask are determined using the Get create issue metadata. These are the same fields that appear on the issue''s create screen. Note that the `description`, `environment`, and any `textarea` type custom fields (multi-line text fields) take Atlassian Document Format content. Single line custom fields (`textfield`) accept a string and don''t handle Atlassian Document Format content.


        Creating a subtask differs from creating an issue as follows:


        * `issueType` must be set to a subtask issue type (use Get create issue metadata to find subtask issue types).

        * `parent` must contain the ID or key of the parent issue.


        In a next-gen project any issue may be made a child providing that the parent and child are members of the same project.


        **Permissions required:** *Browse projects* and *Create issues* project permissions for the project in which the issue or subtask is created.'
      operationId: createIssue
      parameters:
      - description: Whether the project in which the issue is created is added to the user's **Recently viewed** project list, as shown under **Projects** in Jira. When provided, the issue type and request type are added to the user's history for a project. These values are then used to provide defaults on the issue create screen.
        in: query
        name: updateHistory
        schema:
          default: false
          type: boolean
      requestBody:
        content:
          application/json:
            example:
              fields:
                assignee:
                  id: 5b109f2e9729b51b54dc274d
                components:
                - id: '10000'
                customfield_10000: 09/Jun/19
                customfield_20000: 06/Jul/19 3:25 PM
                customfield_30000:
                - '10000'
                - '10002'
                customfield_40000:
                  content:
                  - content:
                    - text: Occurs on all orders
                      type: text
                    type: paragraph
                  type: doc
                  version: 1
                customfield_50000:
                  content:
                  - content:
                    - text: Could impact day-to-day work.
                      type: text
                    type: paragraph
                  type: doc
                  version: 1
                customfield_60000: jira-software-users
                customfield_70000:
                - jira-administrators
                - jira-software-users
                customfield_80000:
                  value: red
                description:
                  content:
                  - content:
                    - text: Order entry fails when selecting supplier.
                      type: text
                    type: paragraph
                  type: doc
                  version: 1
                duedate: '2019-05-11'
                environment:
                  content:
                  - content:
                    - text: UAT
                      type: text
                    type: paragraph
                  type: doc
                  version: 1
                fixVersions:
                - id: '10001'
                issuetype:
                  id: '10000'
                labels:
                - bugfix
                - blitz_test
                parent:
                  key: PROJ-123
                priority:
                  id: '20000'
                project:
                  id: '10000'
                reporter:
                  id: 5b10a2844c20165700ede21g
                security:
                  id: '10000'
                summary: Main order flow broken
                timetracking:
                  originalEstimate: '10'
                  remainingEstimate: '5'
                versions:
                - id: '10000'
              update: {}
            schema:
              $ref: '#/components/schemas/IssueUpdateDetails'
        required: true
      responses:
        '201':
          content:
            application/json:
              example: '{"id":"10000","key":"ED-24","self":"https://your-domain.atlassian.net/rest/api/3/issue/10000","transition":{"status":200,"errorCollection":{"errorMessages":[],"errors":{}}}}'
              schema:
                $ref: '#/components/schemas/CreatedIssue_2'
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["Field ''priority'' is required"],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection_2'
          description: "Returned if the request:\n\n *  is missing required fields.\n *  contains invalid field values.\n *  contains fields that cannot be set for the issue type.\n *  is by a user who does not have the necessary permission.\n *  is to create a subtype in a project different that of the parent issue.\n *  is for a subtask when the option to create subtasks is disabled.\n *  is invalid for any other reason."
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection_2'
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection_2'
          description: Returned if the user does not have the necessary permission.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection_2'
          description: Returned if a configuration problem prevents the creation of the issue.
      security:
      - basicAuth: []
      - OAuth2:
        - write:jira-work
      - {}
      summary: Create issue
      tags:
      - Issues
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - write:jira-work
        state: Current
      - scheme: OAuth2
        scopes:
        - write:issue:jira
        - write:comment:jira
        - write:comment.property:jira
        - write:attachment:jira
        - read:issue:jira
        state: Beta
      x-atlassian-connect-scope: WRITE
    servers:
    - url: https://your-domain.atlassian.net
  /rest/api/3/issue/archive:
    post:
      deprecated: false
      description: 'Enables admins to archive up to 100,000 issues in a single request using JQL, returning the URL to check the status of the submitted request.


        You can use the get task and cancel task APIs to manage the request.


        **Note that:**


        * you can''t archive subtasks directly, only through their parent issues

        * you can only archive issues from software, service management, and business projects


        **Permissions required:** Jira admin or site admin: global permission


        **License required:** Premium or Enterprise


        **Signed-in users only:** This API can''t be accessed anonymously.


        **Rate limiting:** Only a single request per jira instance can be active at any given time.'
      operationId: archiveIssuesAsync
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              jql: project = FOO AND updated < -2y
            schema:
              $ref: '#/components/schemas/ArchiveIssueAsyncRequest'
        description: A JQL query specifying the issues to archive. Note that subtasks can only be archived through their parent issues.
        required: true
      responses:
        '202':
          content:
            application/json:
              example: '"https://your-domain.atlassian.net/rest/api/3/task/1010"'
              schema:
                type: string
          description: Returns the URL to check the status of the submitted request.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["Invalid JQL. Bad request."],"errors":{}}'
          description: Returned if no issues were archived due to a bad request, for example an invalid JQL query.
        '401':
          content:
            application/json:
              example: '{"errorMessages":["User is not logged in."],"errors":{}}'
          description: Returned if no issues were archived because the provided authentication credentials are either missing or invalid.
        '403':
          content:
            application/json:
              example: '{"errorMessages":["Archiving issues is only available for premium editions of Jira."],"errors":{}}'
          description: Returned if no issues were archived because the user lacks the required Jira admin or site admin permissions.
        '412':
          content:
            application/json:
              example: '{"errorMessages":["An issue archival task is already running with ID 1010. To start a new one, cancel the task or wait for it to finish."],"errors":{}}'
          description: Returned if a request to archive issue(s) is already running.
      security:
      - basicAuth: []
      - OAuth2:
        - write:jira-work
      - {}
      summary: Archive issue(s) by JQL
      tags:
      - Issues
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - write:jira-work
        state: Current
      - scheme: OAuth2
        scopes:
        - write:issue:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: WRITE
    put:
      deprecated: false
      description: 'Enables admins to archive up to 1000 issues in a single request using issue ID/key, returning details of the issue(s) archived in the process and the errors encountered, if any.


        **Note that:**


        * you can''t archive subtasks directly, only through their parent issues

        * you can only archive issues from software, service management, and business projects


        **Permissions required:** Jira admin or site admin: global permission


        **License required:** Premium or Enterprise


        **Signed-in users only:** This API can''t be accessed anonymously.'
      operationId: archiveIssues
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              issueIdsOrKeys:
              - PR-1
              - '1001'
              - PROJECT-2
            schema:
              $ref: '#/components/schemas/IssueArchivalSyncRequest'
        description: Contains a list of issue keys or IDs to be archived.
        required: true
      responses:
        '200':
          content:
            application/json:
              example: '{"errors":{"issueIsSubtask":{"count":3,"issueIdsOrKeys":["ST-1","ST-2","ST-3"],"message":"Issue is subtask."},"issuesInArchivedProjects":{"count":2,"issueIdsOrKeys":["AR-1","AR-2"],"message":"Issue exists in archived project."},"issuesInUnlicensedProjects":{"count":3,"issueIdsOrKeys":["UL-1","UL-2","UL-3"],"message":"Issues with these IDs are in unlicensed projects."},"issuesNotFound":{"count":3,"issueIdsOrKeys":["PR-1","PR-2","PR-3"],"message":"Issue not found."}},"numberOfIssuesUpdated":10}'
              schema:
                $ref: '#/components/schemas/IssueArchivalSyncResponse'
          description: Returned if there is at least one valid issue to archive in the request. The return message will include the count of archived issues and subtasks, as well as error details for issues which failed to get archived.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["No valid issue to archive or unarchive. Bad request."],"errors":{}}'
          description: "Returned if none of the issues in the request can be archived. Possible reasons:\n\n *  the issues weren't found\n *  the issues are subtasks\n *  the issues belong to unlicensed projects\n *  the issues belong to archived projects"
        '401':
          content:
            application/json:
              example: '{"errorMessages":["User is not logged in."],"errors":{}}'
          description: Returned if no issues were archived because the provided authentication credentials are either missing or invalid.
        '403':
          content:
            application/json:
              example: '{"errorMessages":["Only admins can archive or unarchive issues. Access denied."],"errors":{}}'
          description: Returned if no issues were archived because the user lacks the required Jira admin or site admin permissions.
        '412':
          content:
            application/json:
              example: '{"errorMessages":["The number of issues to archive or unarchive exceeds the hard limit of 1000. Precondition failed."],"errors":{}}'
          description: Returned if one or more issues were successfully archived, but the operation was incomplete because the number of issue IDs or keys provided exceeds 1000.
