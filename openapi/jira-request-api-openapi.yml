          description: REST API URL for the request.
          format: uri
          type: string
        self:
          format: uri
          type: string
        web:
          description: Web URL for the request.
          format: uri
          type: string
      type: object
    RequestValidationResultDTO:
      additionalProperties: false
      properties:
        errorMessage:
          description: A single, human-readable summary describing why validation failed. Null when valid.
          type: string
        errorMessages:
          description: General validation errors that are not attributable to a single field. Empty when valid.
          items:
            type: string
          type: array
        fieldErrors:
          description: Field-level validation errors, keyed by the failing request field id. Empty when valid.
          items:
