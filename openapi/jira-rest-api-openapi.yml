openapi: 3.2.0
info:
  title: Jira Rest API
  version: 1001.0.0-SNAPSHOT-82b018affa468e58f284fbe4df33536469d757df
  description: 'Operations tagged Rest across 2 of this provider''s published API definitions: jira-platform-openapi.json, jira-service-management-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://your-domain.atlassian.net
tags:
- name: Rest
paths:
  /rest/internal/api/latest/worklog/bulk:
    post:
      deprecated: false
      description: 'Returns worklog details for a list of issue ID and worklog ID pairs.


        This is an internal API for bulk fetching worklogs by their issue and worklog IDs. Worklogs that don''t exist will be filtered out from the response.


        The returned list of worklogs is limited to 1000 items.


        **Permissions required:** This is an internal service-to-service API that requires ASAP authentication. No user permission checks are performed as this bypasses normal user context.'
      operationId: getWorklogsByIssueIdAndWorklogId
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkWorklogKeyRequestBean'
        description: A JSON object containing a list of issue ID and worklog ID pairs.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkWorklogKeyResponseBean'
          description: Returned if the request is successful.
        '400':
          description: Returned if the request contains more than 1000 worklog pairs, is empty, or has invalid format.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '500':
          description: Returned if there is an internal server error.
      security:
      - basicAuth: []
      summary: Get worklogs by issue id and worklog id
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: INACCESSIBLE
      tags:
      - Rest
    servers:
    - url: https://your-domain.atlassian.net
  /rest/servicedeskapi/customer/skip-permission-check:
    post:
      deprecated: false
      description: 'Creates a customer account on behalf of jsd-nutmeg.


        This endpoint is restricted to jsd-nutmeg via ASAP authentication. It provides the same capability as the public \{@code POST /servicedeskapi/customer\} endpoint, but does not require a User Context Token (UCT) or Connect app user \\u2014 authorization is enforced entirely via the ASAP token.


        No user permission checks are performed; \{@code null\} is passed as the acting user to bypass the permission check in the underlying service.'
      operationId: createCustomer
      parameters:
      - description: Optional boolean flag; when \{@code true\}, returns 409 Conflict for duplicate email instead of the default 400.
        in: query
        name: strictConflictStatusCode
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateDTO'
        description: JSON body containing the email address and display name of the customer to create.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
          description: 201 response
      summary: Create customer
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: INACCESSIBLE
      tags:
      - Rest
    servers:
    - url: https://your-domain.atlassian.net
  /rest/servicedeskapi/knowledgebase/article/view/{pageId}:
    get:
      deprecated: false
      description: ''
      operationId: viewArticle
      parameters:
      - in: path
        name: pageId
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: 200 response
      security:
      - OAuth2:
        - read:servicedesk-request
      - {}
      summary: View knowledge base article
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - read:servicedesk-request
        state: Current
      - scheme: OAuth2
        scopes:
        - read:knowledgebase:jira-service-management
        state: Beta
      x-atlassian-connect-scope: READ
      tags:
      - Rest
    servers:
    - url: https://your-domain.atlassian.net
  /rest/servicedeskapi/servicedesk/{serviceDeskId}/customer/skip-permission-check:
    post:
      deprecated: false
      description: 'Adds one or more customers to a service desk on behalf of jsd-nutmeg.


        This endpoint is restricted to jsd-nutmeg via ASAP authentication. It provides the same capability as the public \{@code POST /servicedeskapi/servicedesk/\{serviceDeskId\}/customer\} endpoint, but does not require a User Context Token (UCT) or Connect app user \\u2014 authorization is enforced entirely via the ASAP token.


        No user permission checks are performed; \{@code null\} is passed as the acting user to bypass the permission check in the underlying service.


        If any of the passed customers are already associated with the service desk, no changes will be made for those customers and the resource returns a 204 success code.'
      operationId: addCustomers
      parameters:
      - description: The ID of the service desk to add customers to. This can alternatively be a project identifier.
        in: path
        name: serviceDeskId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceDeskCustomerDTO'
        description: JSON body containing the account IDs of customers to add.
        required: true
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: The request completed successfully. No additional content will be sent in the response.
      summary: Add customers
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: INACCESSIBLE
      tags:
      - Rest
    servers:
    - url: https://your-domain.atlassian.net
components:
  schemas:
    WorklogKeyResult:
      additionalProperties: false
      properties:
        issueId:
          description: The issue ID.
          format: int64
          type: integer
        worklogId:
          description: The worklog ID.
          format: int64
          type: integer
      type: object
    WorklogCompositeKey:
      additionalProperties: false
      properties:
        issueId:
          description: The issue ID.
          format: int64
          type: integer
        worklogId:
          description: The worklog ID.
          format: int64
          type: integer
      type: object
    BulkWorklogKeyRequestBean:
      additionalProperties: false
      properties:
        requests:
          description: A list of issue and worklog ID pairs.
          items:
            $ref: '#/components/schemas/WorklogCompositeKey'
          type: array
      type: object
    BulkWorklogKeyResponseBean:
      additionalProperties: false
      properties:
        worklogs:
          description: A list of successfully retrieved worklogs with their issue and worklog IDs.
          items:
            $ref: '#/components/schemas/WorklogKeyResult'
          type: array
      type: object
    UserLinkDTO:
      additionalProperties: false
      properties:
        avatarUrls:
          additionalProperties:
            type: string
          description: Links to the various sizes of the customer's avatar. Note that this property is deprecated, and will be removed in future versions.
          type: object
        jiraRest:
          description: REST API URL for the customer.
          format: uri
          type: string
        self:
          format: uri
          type: string
      type: object
    UserDTO:
      additionalProperties: false
      properties:
        _links:
          allOf:
          - $ref: '#/components/schemas/UserLinkDTO'
          description: URLs for the customer record and related items.
        accountId:
          description: The accountId of the user, which uniquely identifies the user across all Atlassian products. For example, *5b10ac8d82e05b22cc7d4ef5*.
          type: string
        active:
          description: Indicates if the customer is active (true) or inactive (false)
          type: boolean
        displayName:
          description: Customer's name for display in a UI. Depending on the customer’s privacy settings, this may return an alternative value.
          type: string
        emailAddress:
          description: Customer's email address. Depending on the customer’s privacy settings, this may be returned as null.
          type: string
        key:
          description: This property is no longer available and will be removed from the documentation soon. See the [deprecation notice](https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-user-privacy-api-migration-guide/) for details.
          type: string
        name:
          description: This property is no longer available and will be removed from the documentation soon. See the [deprecation notice](https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-user-privacy-api-migration-guide/) for details.
          type: string
        timeZone:
          description: Customer time zone. Depending on the customer’s privacy settings, this may be returned as null.
          type: string
      type: object
    CustomerCreateDTO:
      additionalProperties: false
      properties:
        displayName:
          description: Customer's name for display in the UI.
          type: string
        email:
          description: Customer's email address.
          type: string
        fullName:
          description: Deprecated, please use 'displayName'.
          type: string
      type: object
    ServiceDeskCustomerDTO:
      additionalProperties: false
      properties:
        accountIds:
          description: List of users, specified by account IDs, to add to or remove from a service desk.
          items:
            type: string
          type: array
          uniqueItems: true
        usernames:
          description: This property is no longer available and will be removed from the documentation soon. See the [deprecation notice](https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-user-privacy-api-migration-guide/) for details. Use `accountIds` instead.
          items:
            type: string
          type: array
          uniqueItems: true
      type: object
