  description: Jira Cloud platform REST API documentation
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://developer.atlassian.com/platform/marketplace/atlassian-developer-terms/
  title: Jira Cloud platform REST Issue bulk operations API
  version: 1001.0.0-SNAPSHOT-82b018affa468e58f284fbe4df33536469d757df
servers:
- url: https://your-domain.atlassian.net
tags:
- description: This resource represents the issue bulk operations.
  name: Issue bulk operations
paths:
  /rest/api/3/bulk/issues/delete:
    post:
      deprecated: false
      description: 'Use this API to submit a bulk delete request. You can delete up to 1,000 issues in a single operation.


        **Permissions required:**


        * Global bulk change permission.

        * Delete issues permission in all projects that contain the selected issues.

        * Browse project permission in all projects that contain the selected issues.

        * If issue-level security is configured, issue-level security permission to view the issue.'
      operationId: submitBulkDelete
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              selectedIssueIdsOrKeys:
              - '10001'
              - '10002'
              sendBulkNotification: false
            schema:
              $ref: '#/components/schemas/IssueBulkDeletePayload'
        description: The request body containing the issues to be deleted.
        required: true
      responses:
        '201':
          content:
            application/json:
              example: '{"taskId":"10641"}'
              schema:
                $ref: '#/components/schemas/SubmittedBulkOperation'
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errors":[{"message":"Some of the issues in the issueIdsOrKeys are not valid"}]}'
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the request is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the user does not have the necessary permission.
      security:
      - basicAuth: []
      - OAuth2:
        - write:jira-work
      summary: Bulk delete issues
      tags:
      - Issue bulk operations
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - write:jira-work
        state: Current
      - scheme: OAuth2
        scopes:
        - write:issue:jira
        - read:issue:jira
        state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/bulk/issues/fields:
    get:
      deprecated: false
      description: 'Use this API to get a list of fields visible to the user to perform bulk edit operations. You can pass single or multiple issues in the query to get eligible editable fields. This API uses pagination to return responses, delivering 50 fields at a time.


        **Permissions required:**


        * Global bulk change permission.

        * Browse project permission in all projects that contain the selected issues.

        * If issue-level security is configured, issue-level security permission to view the issue.

        * Depending on the field, any field-specific permissions required to edit it.'
      operationId: getBulkEditableFields
      parameters:
      - description: The IDs or keys of the issues to get editable fields from.
        in: query
        name: issueIdsOrKeys
        required: true
        schema:
          type: string
      - description: (Optional)The text to search for in the editable fields.
        in: query
        name: searchText
        schema:
          type: string
      - description: (Optional)The end cursor for use in pagination.
        in: query
        name: endingBefore
        schema:
          type: string
      - description: (Optional)The start cursor for use in pagination.
        in: query
        name: startingAfter
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"fields":[{"id":"assignee","isRequired":false,"name":"Assignee","searchUrl":"https://your-domain.atlassian.net/rest/api/3/user/assignable/multiProjectSearch?projectKeys=KAN&query=","type":"assignee"},{"id":"components","isRequired":false,"multiSelectFieldOptions":["ADD","REMOVE","REPLACE","REMOVE_ALL"],"name":"Components","type":"components","unavailableMessage":"{0}NOTE{1}: The project of the selected issue(s) does not have any components."},{"fieldOptions":[{"description":"This problem will block progress.","id":"1","priority":"Highest"},{"description":"Has the potential to affect progress.","id":"2","priority":"Lowest"},{"description":"Trivial problem with little or no impact on progress.","id":"3","priority":"Medium"}],"id":"priority","isRequired":false,"name":"Priority","type":"priority"}]}'
              schema:
                $ref: '#/components/schemas/BulkEditGetFields'
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the user does not have the necessary permission.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if no editable fields are found for the provided issue IDs.
      security:
      - basicAuth: []
      - OAuth2:
        - read:jira-work
      summary: Get bulk editable fields
      tags:
      - Issue bulk operations
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - read:jira-work
        state: Current
      - scheme: OAuth2
        scopes:
        - read:issue:jira
        state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
    post:
      deprecated: false
      description: 'Use this API to submit a bulk edit request and simultaneously edit multiple issues. There are limits applied to the number of issues and fields that can be edited. A single request can accommodate a maximum of 1000 issues (including subtasks) and 200 fields.


        **Permissions required:**


        * Global bulk change permission.

        * Browse project permission in all projects that contain the selected issues.

        * Edit issues permission in all projects that contain the selected issues.

        * If issue-level security is configured, issue-level security permission to view the issue.'
      operationId: submitBulkEdit
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueBulkEditPayload'
        description: The request body containing the issues to be edited and the new field values.
        required: true
      responses:
        '201':
          content:
            application/json:
              example: '{"taskId":"10641"}'
              schema:
                $ref: '#/components/schemas/SubmittedBulkOperation'
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errors":[{"message":"The following editedFieldInput values are not listed as selectedActions : issuetype"}]}'
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the request is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the authentication credentials are incorrect or missing.
      security:
      - basicAuth: []
      - OAuth2:
        - write:jira-work
      summary: Bulk edit issues
      tags:
      - Issue bulk operations
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - write:jira-work
        state: Current
      - scheme: OAuth2
        scopes:
        - write:issue:jira
        - read:issue:jira
        state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/bulk/issues/move:
    post:
      deprecated: false
      description: 'Use this API to submit a bulk issue move request. You can move multiple issues from multiple projects in a single request, but they must all be moved to a single project, issue type, and parent. You can''t move more than 1000 issues (including subtasks) at once.


        #### Scenarios: ####


        This is an early version of the API and it doesn''t have full feature parity with the Bulk Move UI experience.


        * Moving issue of type A to issue of type B in the same project or a different project: `SUPPORTED`

        * Moving multiple issues of type A in one or more projects to multiple issues of type B in one of the source projects or a different project: `SUPPORTED`

        * Moving issues of multiple issue types in one or more projects to issues of a single issue type in one of the source project or a different project: **`SUPPORTED`**

        E.g. Moving issues of story and task issue types in project 1 and project 2 to issues of task issue type in project 3

        * Moving a standard parent issue of type A with its multiple subtask issue types in one project to standard issue of type B and multiple subtask issue types in the same project or a different project: `SUPPORTED`

        * Moving standard issues with their subtasks to a parent issue in the same project or a different project without losing their relation: `SUPPORTED`

        * Moving an epic issue with its child issues to a different project without losing their relation: `SUPPORTED`

        This usecase is **supported using multiple requests**. Move the epic in one request and then move the children in a separate request with target parent set to the epic issue id


        (Alternatively, move them individually and stitch the relationship back with the Bulk Edit API)


        #### Limits applied to bulk issue moves: ####


        When using the bulk move, keep in mind that there are limits on the number of issues and fields you can include.


        * You can move up to 1,000 issues in a single operation, including any subtasks.

        * The total combined number of fields across all issues must not exceed 1,500,000. For example, if each issue includes 15,000 fields, then the maximum number of issues that can be moved is 100.


        **Permissions required:**


        * Global bulk change permission.

        * Move issues permission in source projects.

        * Create issues permission in destination projects.

        * Browse project permission in destination projects, if moving subtasks only.

        * If issue-level security is configured, issue-level security permission to view the issue.'
      operationId: submitBulkMove
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              sendBulkNotification: true
              targetToSourcesMapping:
                PROJECT-KEY,10001:
                  inferClassificationDefaults: false
                  inferFieldDefaults: false
                  inferStatusDefaults: false
                  inferSubtaskTypeDefault: true
                  issueIdsOrKeys:
                  - ISSUE-1
                  targetClassification:
                  - classifications:
                      5bfa70f7-4af1-44f5-9e12-1ce185f15a38:
                      - bd58e74c-c31b-41a7-ba69-9673ebd9dae9
                      - '-1'
                  targetMandatoryFields:
                  - fields:
                      customfield_10000:
                        retain: false
                        type: raw
                        value:
                        - value-1
                        - value-2
                      description:
                        retain: true
                        type: adf
                        value:
                          content:
                          - content:
                            - text: New description value
                              type: text
                            type: paragraph
                          type: doc
                          version: 1
                      fixVersions:
                        retain: false
                        type: raw
                        value:
                        - '10009'
                      labels:
                        retain: false
                        type: raw
                        value:
                        - label-1
                        - label-2
                  targetStatus:
                  - statuses:
                      '10001':
                      - '10002'
                      - '10003'
            schema:
              $ref: '#/components/schemas/IssueBulkMovePayload'
        required: true
      responses:
        '201':
          content:
            application/json:
              example: '{"taskId":"10641"}'
              schema:
                $ref: '#/components/schemas/SubmittedBulkOperation'
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errors":[{"message":"Some of the issues in the issueIdsOrKeys are not valid"}]}'
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the request is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the authentication credentials are incorrect or missing.
      security:
      - basicAuth: []
      - OAuth2:
        - write:jira-work
      summary: Bulk move issues
      tags:
      - Issue bulk operations
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - write:jira-work
        state: Current
      - scheme: OAuth2
        scopes:
        - write:issue:jira
        - read:issue:jira
        state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/bulk/issues/transition:
    get:
      deprecated: false
      description: 'Use this API to retrieve a list of transitions available for the specified issues that can be used or bulk transition operations. You can submit either single or multiple issues in the query to obtain the available transitions.


        The response will provide the available transitions for issues, organized by their respective workflows. **Only the transitions that are common among the issues within that workflow and do not involve any additional field updates will be included.** For bulk transitions that require additional field updates, please utilise the Jira Cloud UI.


        You can request available transitions for up to 1,000 issues in a single operation. This API uses pagination to return responses, delivering 50 workflows at a time.


        **Permissions required:**


        * Global bulk change permission.

        * Transition issues permission in all projects that contain the selected issues.

        * Browse project permission in all projects that contain the selected issues.

        * If issue-level security is configured, issue-level security permission to view the issue.'
      operationId: getAvailableTransitions
      parameters:
      - description: Comma (,) separated Ids or keys of the issues to get transitions available for them.
        in: query
        name: issueIdsOrKeys
        required: true
        schema:
          type: string
      - description: (Optional)The end cursor for use in pagination.
        in: query
        name: endingBefore
        schema:
          type: string
      - description: (Optional)The start cursor for use in pagination.
        in: query
        name: startingAfter
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"availableTransitions":[{"isTransitionsFiltered":false,"issues":["EPIC-1","TASK-1"],"transitions":[{"to":{"statusId":10001,"statusName":"To Do"},"transitionId":11,"transitionName":"To Do"},{"to":{"statusId":10002,"statusName":"In Progress"},"transitionId":21,"transitionName":"In Progress"},{"to":{"statusId":10003,"statusName":"Done"},"transitionId":31,"transitionName":"Done"}]},{"isTransitionsFiltered":true,"issues":["BUG-1"],"transitions":[{"to":{"statusId":10004,"statusName":"To Do bug"},"transitionId":41,"transitionName":"To Do bug"},{"to":{"statusId":10005,"statusName":"Triage"},"transitionId":51,"transitionName":"Triage"}]}]}'
              schema:
                $ref: '#/components/schemas/BulkTransitionGetAvailableTransitions'
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errors":[{"message":"Some of the issues in the issueIdsOrKeys are not valid"}]}'
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the request is not valid. For example, if a provided issue ID or key is invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationErrorResponse'
          description: Returned if the user does not have the necessary permission.
      security:
      - basicAuth: []
      - OAuth2:
        - read:jira-work
      summary: Get available transitions
      tags:
      - Issue bulk operations
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - read:jira-work
        state: Current
      - scheme: OAuth2
        scopes:
        - read:issue:jira
        state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
    post:
      deprecated: false
      description: 'Use this API to submit a bulk issue status transition request. You can transition multiple issues, alongside with their valid transition Ids. You can transition up to 1,000 issues in a single operation.


        **Permissions required:**


        * Global bulk change permission.

        * Transition issues permission in all projects that contain the selected issues.

        * Browse project permission in all projects that contain the selected issues.

        * If issue-level security is configured, issue-level security permission to view the issue.'
