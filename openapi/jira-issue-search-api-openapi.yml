  /rest/api/3/search/jql:
    get:
      deprecated: false
      description: 'Searches for issues using JQL. Recent updates might not be immediately visible in the returned search results. If you need read-after-write consistency, you can utilize the `reconcileIssues` parameter to ensure stronger consistency assurances. This operation can be accessed anonymously.


        If the JQL query expression is too large to be encoded as a query parameter, use the POST version of this resource.


        **Permissions required:** Issues are included in the response where the user has:


        * *Browse projects* project permission for the project containing the issue.

        * If issue-level security is configured, issue-level security permission to view the issue.'
      operationId: searchAndReconsileIssuesUsingJql
      parameters:
      - description: "A [JQL](https://confluence.atlassian.com/x/egORLQ) expression. For performance reasons, this parameter requires a bounded query. A bounded query is a query with a search restriction.\n\n *  Example of an unbounded query: `order by key desc`.\n *  Example of a bounded query: `assignee = currentUser() order by key`.\n\nAdditionally, `orderBy` clause can contain a maximum of 7 fields."
        in: query
        name: jql
        schema:
          example: project = HSP
          type: string
        x-showInExample: 'true'
      - description: 'The token for a page to fetch that is not the first page. The first page has a `nextPageToken` of `null`. Use the `nextPageToken` to fetch the next page of issues.


          Note: The `nextPageToken` field is **not included** in the response for the last page, indicating there is no next page.'
        in: query
        name: nextPageToken
        schema:
          example: <string>
          type: string
        x-showInExample: 'true'
      - description: The maximum number of items to return per page. To manage page size, API may return fewer items per page where a large number of fields or properties are requested. The greatest number of items returned per page is achieved when requesting `id` or `key` only. It returns max 5000 issues.
        in: query
        name: maxResults
        schema:
          default: 50
          example: 114
          format: int32
          type: integer
        x-showInExample: 'true'
      - description: "A list of fields to return for each issue, use it to retrieve a subset of fields. This parameter accepts a comma-separated list. Expand options include:\n\n *  `*all` Returns all fields.\n *  `*navigable` Returns navigable fields.\n *  `id` Returns only issue IDs.\n *  Any issue field, prefixed with a minus to exclude.\n\nThe default is `id`.\n\nExamples:\n\n *  `summary,comment` Returns only the summary and comments fields only.\n *  `-description` Returns all navigable (default) fields except description.\n *  `*all,-comment` Returns all fields except comments.\n\nMultiple `fields` parameters can be included in a request.\n\nNote: By default, this resource returns IDs only. This differs from [GET issue](#api-rest-api-3-issue-issueIdOrKey-get) where the default is all fields."
        in: query
        name: fields
        schema:
          items:
            default: id
            type: string
          type: array
        x-showInExample: 'true'
      - description: "Use [expand](#expansion) to include additional information about issues in the response. Note that, unlike the majority of instances where `expand` is specified, `expand` is defined as a comma-delimited string of values. The expand options are:\n\n *  `renderedFields` Returns field values rendered in HTML format.\n *  `names` Returns the display name of each field.\n *  `schema` Returns the schema describing a field type.\n *  `transitions` Returns all possible transitions for the issue.\n *  `operations` Returns all possible operations for the issue.\n *  `editmeta` Returns information about how each field can be edited.\n *  `changelog` Returns a list of recent updates to an issue, sorted by date, starting from the most recent.\n *  `versionedRepresentations` Instead of `fields`, returns `versionedRepresentations` a JSON array containing each version of a field's value, with the highest numbered item representing the most recent version.\n\nExamples: `\"names,changelog\"` Returns the display name of each field as well as a list of recent updates to an issue."
        in: query
        name: expand
        schema:
          example: <string>
          type: string
        x-showInExample: 'true'
      - description: A list of up to 5 issue properties to include in the results. This parameter accepts a comma-separated list.
        in: query
        name: properties
        schema:
          items:
            type: string
          type: array
      - description: Reference fields by their key (rather than ID). The default is `false`.
        in: query
        name: fieldsByKeys
        schema:
          default: false
          type: boolean
      - description: Fail this request early if we can't retrieve all field data.
        in: query
        name: failFast
        schema:
          default: false
          type: boolean
      - description: Strong consistency issue ids to be reconciled with search results. Accepts max 50 ids. This list of ids should be consistent with each paginated request across different pages.
        in: query
        name: reconcileIssues
        schema:
          items:
            format: int64
            type: integer
          type: array
        x-showInExample: 'true'
      - description: Whether to also return issues that belong to [archived projects](https://support.atlassian.com/jira-cloud-administration/docs/archive-a-project/). Issues in archived projects are excluded by default. Setting this to `true` returns them alongside issues from active projects; the *Browse projects* permission is still required on the archived project. The default is `false`.
        in: query
        name: includeArchivedProjects
        schema:
          default: false
          type: boolean
