openapi: 3.2.0
info:
  title: Jira Projects API
  x-refined-note:
  - x-atlassian-api-version differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Projects across 2 of this provider''s published API definitions: jira-cloud-platform-rest-api-openapi.yml, jira-platform-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{domain}.atlassian.net/rest/api/3
  description: Jira Cloud instance
  variables:
    domain:
      description: Your Jira Cloud site subdomain (e.g., your-company).
      default: your-domain
- url: https://your-domain.atlassian.net
tags:
- name: Projects
  description: Manage Jira projects including metadata, roles, and components.
  externalDocs:
    description: Jira Projects REST API documentation
    url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-projects/
paths:
  /project:
    get:
      summary: Jira Get All Projects
      description: Returns all projects visible to the user. Deprecated, use Get projects paginated that supports search and pagination.
      operationId: getAllProjects
      tags:
      - Projects
      externalDocs:
        description: API method documentation
        url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-projects/#api-rest-api-3-project-get
      parameters:
      - name: expand
        in: query
        description: 'Use expand to include additional information in the response. Accepted values: description, issueTypes, lead, projectKeys, url.'
        required: false
        schema:
          type: string
        example: example_value
      - name: recent
        in: query
        description: Returns projects the user has accessed in the last given number of projects, up to 20.
        required: false
        schema:
          type: integer
          format: int32
        example: 10
      - name: properties
        in: query
        description: A list of project properties to return for each project.
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        example: []
      responses:
        '200':
          description: Projects returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
              examples:
                Getallprojects200Example:
                  summary: Default getAllProjects 200 response
                  x-microcks-default: true
                  value:
                  - self: https://www.example.com
                    id: abc123
                    key: example_value
                    name: Example Title
                    description: A sample description.
                    lead:
                      self: https://www.example.com
                      accountId: '500123'
                      emailAddress: user@example.com
                      displayName: example_value
                      active: true
                      timeZone: example_value
                      accountType: atlassian
                    components:
                    - {}
                    issueTypes:
                    - {}
                    url: https://www.example.com
                    assigneeType: PROJECT_LEAD
                    versions:
                    - {}
                    roles: example_value
                    avatarUrls:
                      16x16: https://www.example.com
                      24x24: https://www.example.com
                      32x32: https://www.example.com
                      48x48: https://www.example.com
                    projectCategory:
                      self: https://www.example.com
                      id: abc123
                      name: Example Title
                      description: A sample description.
                    projectTypeKey: software
                    simplified: true
                    style: classic
                    archived: true
                    deleted: true
                    insight:
                      totalIssueCount: 10
                      lastIssueUpdateTime: '2026-01-15T10:30:00Z'
        '401':
          description: Authentication credentials are missing or invalid.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oauth2: []
      - bearerAuth: []
    servers:
    - url: https://{domain}.atlassian.net/rest/api/3
      description: Jira Cloud instance
      variables:
        domain:
          description: Your Jira Cloud site subdomain (e.g., your-company).
          default: your-domain
  /project/search:
    get:
      summary: Jira Get Projects Paginated
      description: Returns a paginated list of projects visible to the user. This operation can be filtered by project type, category, and action.
      operationId: searchProjects
      tags:
      - Projects
      externalDocs:
        description: API method documentation
        url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-projects/#api-rest-api-3-project-search-get
      parameters:
      - name: startAt
        in: query
        description: The index of the first item to return in a page of results (page offset).
        required: false
        schema:
          type: integer
          format: int64
          default: 0
        example: 10
      - name: maxResults
        in: query
        description: The maximum number of items to return per page.
        required: false
        schema:
          type: integer
          format: int32
          default: 50
        example: 10
      - name: orderBy
        in: query
        description: 'Order the results by a field. Accepted values: category, key, name, owner, issueCount, lastIssueUpdatedTime, archivedDate. Prefix with + or - for ascending/descending.'
        required: false
        schema:
          type: string
          default: key
        example: example_value
      - name: query
        in: query
        description: Filter results using a literal string match on project name or key.
        required: false
        schema:
          type: string
        example: example_value
      - name: typeKey
        in: query
        description: 'The type key of the project. Accepted values: business, service_desk, software.'
        required: false
        schema:
          type: string
        example: example_value
      - name: categoryId
        in: query
        description: The ID of the project category to filter by.
        required: false
        schema:
          type: integer
          format: int64
        example: '500123'
      - name: action
        in: query
        description: 'Filter results by what the user has permission to do. Accepted values: view, browse, edit, create.'
        required: false
        schema:
          type: string
          default: view
        example: example_value
      - name: expand
        in: query
        description: 'Use expand to include additional information in the response. Accepted values: description, projectKeys, lead, issueTypes, url, insight.'
        required: false
        schema:
          type: string
        example: example_value
      - name: status
        in: query
        description: 'The status of the project. Accepted values: live, archived, deleted.'
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - live
            - archived
            - deleted
        style: form
        explode: true
        example: []
      responses:
        '200':
          description: Paginated project list returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBeanProject'
              examples:
                Searchprojects200Example:
                  summary: Default searchProjects 200 response
                  x-microcks-default: true
                  value:
                    self: https://www.example.com
                    nextPage: https://www.example.com
                    maxResults: 10
                    startAt: 10
                    total: 10
                    isLast: true
                    values:
                    - self: https://www.example.com
                      id: abc123
                      key: example_value
                      name: Example Title
                      description: A sample description.
                      components: {}
                      issueTypes: {}
                      url: https://www.example.com
                      assigneeType: PROJECT_LEAD
                      versions: {}
                      roles: example_value
                      projectTypeKey: software
                      simplified: true
                      style: classic
                      archived: true
                      deleted: true
                      insight: {}
        '400':
          description: The request is invalid.
        '401':
          description: Authentication credentials are missing or invalid.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oauth2: []
      - bearerAuth: []
    servers:
    - url: https://{domain}.atlassian.net/rest/api/3
      description: Jira Cloud instance
      variables:
        domain:
          description: Your Jira Cloud site subdomain (e.g., your-company).
          default: your-domain
  /project/{projectIdOrKey}:
    get:
      summary: Jira Get Project
      description: Returns the project details for a project. The returned project includes additional information such as issue types, components, versions, and roles.
      operationId: getProject
      tags:
      - Projects
      externalDocs:
        description: API method documentation
        url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-projects/#api-rest-api-3-project-projectidorkey-get
      parameters:
      - $ref: '#/components/parameters/projectIdOrKey'
      - name: expand
        in: query
        description: 'Use expand to include additional information in the response. Accepted values: description, issueTypes, lead, projectKeys, url, insight.'
        required: false
        schema:
          type: string
        example: example_value
      - name: properties
        in: query
        description: A list of project properties to return for the project.
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        example: []
      responses:
        '200':
          description: Project details returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                Getproject200Example:
                  summary: Default getProject 200 response
                  x-microcks-default: true
                  value:
                    self: https://www.example.com
                    id: abc123
                    key: example_value
                    name: Example Title
                    description: A sample description.
                    lead:
                      self: https://www.example.com
                      accountId: '500123'
                      emailAddress: user@example.com
                      displayName: example_value
                      active: true
                      timeZone: example_value
                      accountType: atlassian
                    components:
                    - self: https://www.example.com
                      id: abc123
                      name: Example Title
                      description: A sample description.
                      assigneeType: PROJECT_DEFAULT
                      project: example_value
                      projectId: '500123'
                    issueTypes:
                    - self: https://www.example.com
                      id: abc123
                      description: A sample description.
                      iconUrl: https://www.example.com
                      name: Example Title
                      subtask: true
                      avatarId: '500123'
                      hierarchyLevel: 10
                    url: https://www.example.com
                    assigneeType: PROJECT_LEAD
                    versions:
                    - self: https://www.example.com
                      id: abc123
                      name: Example Title
                      description: A sample description.
                      archived: true
                      released: true
                      releaseDate: '2026-01-15'
                      startDate: '2026-01-15'
                      overdue: true
                      projectId: '500123'
                    roles: example_value
                    avatarUrls:
                      16x16: https://www.example.com
                      24x24: https://www.example.com
                      32x32: https://www.example.com
                      48x48: https://www.example.com
                    projectCategory:
                      self: https://www.example.com
                      id: abc123
                      name: Example Title
                      description: A sample description.
                    projectTypeKey: software
                    simplified: true
                    style: classic
                    archived: true
                    deleted: true
                    insight:
                      totalIssueCount: 10
                      lastIssueUpdateTime: '2026-01-15T10:30:00Z'
        '401':
          description: Authentication credentials are missing or invalid.
        '404':
          description: The project was not found or the user does not have permission to view it.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oauth2: []
      - bearerAuth: []
    servers:
    - url: https://{domain}.atlassian.net/rest/api/3
      description: Jira Cloud instance
      variables:
        domain:
          description: Your Jira Cloud site subdomain (e.g., your-company).
          default: your-domain
  /project/{projectIdOrKey}/statuses:
    get:
      summary: Jira Get All Statuses for Project
      description: Returns the valid statuses for a project. The statuses are grouped by issue type, listing the allowed statuses for each issue type in the project.
      operationId: getAllStatuses
      tags:
      - Projects
      externalDocs:
        description: API method documentation
        url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-projects/#api-rest-api-3-project-projectidorkey-statuses-get
      parameters:
      - $ref: '#/components/parameters/projectIdOrKey'
      responses:
        '200':
          description: Statuses returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueTypeWithStatus'
              examples:
                Getallstatuses200Example:
                  summary: Default getAllStatuses 200 response
                  x-microcks-default: true
                  value:
                  - self: https://www.example.com
                    id: abc123
                    name: Example Title
                    subtask: true
                    statuses:
                    - {}
        '401':
          description: Authentication credentials are missing or invalid.
        '404':
          description: The project was not found or the user does not have permission to view it.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oauth2: []
      - bearerAuth: []
    servers:
    - url: https://{domain}.atlassian.net/rest/api/3
      description: Jira Cloud instance
      variables:
        domain:
          description: Your Jira Cloud site subdomain (e.g., your-company).
          default: your-domain
  /rest/api/3/project:
    get:
      deprecated: true
      description: 'Returns all projects visible to the user. Deprecated, use Get projects paginated that supports search and pagination.


        This operation can be accessed anonymously.


        **Permissions required:** Projects are returned only where the user has *Browse Projects* or *Administer projects* project permission for the project.'
      operationId: getAllProjects
      parameters:
      - description: "Use [expand](#expansion) to include additional information in the response. This parameter accepts a comma-separated list. Expanded options include:\n\n *  `description` Returns the project description.\n *  `issueTypes` Returns all issue types associated with the project.\n *  `lead` Returns information about the project lead.\n *  `projectKeys` Returns all project keys associated with the project."
        in: query
        name: expand
        schema:
          type: string
      - description: Returns the user's most recently accessed projects. You may specify the number of results to return up to a maximum of 20. If access is anonymous, then the recently accessed projects are based on the current HTTP session.
        in: query
        name: recent
        schema:
          format: int32
          type: integer
      - description: A list of project properties to return for the project. This parameter accepts a comma-separated list.
        in: query
        name: properties
        schema:
          items:
            default: ''
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              example: '[{"avatarUrls":{"16x16":"https://your-domain.atlassian.net/secure/projectavatar?size=xsmall&pid=10000","24x24":"https://your-domain.atlassian.net/secure/projectavatar?size=small&pid=10000","32x32":"https://your-domain.atlassian.net/secure/projectavatar?size=medium&pid=10000","48x48":"https://your-domain.atlassian.net/secure/projectavatar?size=large&pid=10000"},"id":"10000","insight":{"lastIssueUpdateTime":1619069825000,"totalIssueCount":100},"key":"EX","name":"Example","projectCategory":{"description":"First Project Category","id":"10000","name":"FIRST","self":"https://your-domain.atlassian.net/rest/api/3/projectCategory/10000"},"self":"https://your-domain.atlassian.net/rest/api/3/project/EX","simplified":false,"style":"CLASSIC"},{"avatarUrls":{"16x16":"https://your-domain.atlassian.net/secure/projectavatar?size=xsmall&pid=10001","24x24":"https://your-domain.atlassian.net/secure/projectavatar?size=small&pid=10001","32x32":"https://your-domain.atlassian.net/secure/projectavatar?size=medium&pid=10001","48x48":"https://your-domain.atlassian.net/secure/projectavatar?size=large&pid=10001"},"id":"10001","insight":{"lastIssueUpdateTime":1619069825000,"totalIssueCount":100},"key":"ABC","name":"Alphabetical","projectCategory":{"description":"First Project Category","id":"10000","name":"FIRST","self":"https://your-domain.atlassian.net/rest/api/3/projectCategory/10000"},"self":"https://your-domain.atlassian.net/rest/api/3/project/ABC","simplified":false,"style":"CLASSIC"}]'
              schema:
                items:
                  $ref: '#/components/schemas/Project_2'
                type: array
          description: Returned if the request is successful.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
      security:
      - basicAuth: []
      - OAuth2:
        - read:jira-work
      - {}
      summary: Get all projects
      tags:
      - Projects
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - read:jira-work
        state: Current
      - scheme: OAuth2
        scopes:
        - read:issue-type:jira
        - read:project:jira
        - read:project.property:jira
        - read:user:jira
        - read:application-role:jira
        - read:avatar:jira
        - read:group:jira
        - read:issue-type-hierarchy:jira
        - read:project-category:jira
        - read:project-version:jira
        - read:project.component:jira
        state: Beta
      x-changes:
      - announced: '2018-10-19'
        details: https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-removal-of-get-filters-and-get-all-projects/
        effective: '2019-04-19'
        type: removed
      x-atlassian-connect-scope: READ
    post:
      deprecated: false
      description: 'Creates a project based on a project type template, as shown in the following table:


        | Project Type Key | Project Template Key |

        |--|--|

        | `business` | `com.atlassian.jira-core-project-templates:jira-core-simplified-content-management`, `com.atlassian.jira-core-project-templates:jira-core-simplified-document-approval`, `com.atlassian.jira-core-project-templates:jira-core-simplified-lead-tracking`, `com.atlassian.jira-core-project-templates:jira-core-simplified-process-control`, `com.atlassian.jira-core-project-templates:jira-core-simplified-procurement`, `com.atlassian.jira-core-project-templates:jira-core-simplified-project-management`, `com.atlassian.jira-core-project-templates:jira-core-simplified-recruitment`, `com.atlassian.jira-core-project-templates:jira-core-simplified-task-tracking` |

        | `service_desk` | `com.atlassian.servicedesk:simplified-it-service-management`, `com.atlassian.servicedesk:simplified-external-service-desk`, `com.atlassian.servicedesk:simplified-hr-service-desk`, `com.atlassian.servicedesk:simplified-facilities-service-desk`, `com.atlassian.servicedesk:simplified-legal-service-desk`, `com.atlassian.servicedesk:simplified-analytics-service-desk`, `com.atlassian.servicedesk:simplified-marketing-service-desk`, `com.atlassian.servicedesk:simplified-design-service-desk`, `com.atlassian.servicedesk:simplified-sales-service-desk`, `com.atlassian.servicedesk:simplified-finance-service-desk`, `com.atlassian.servicedesk:company-managed-blank-service-project`, `com.atlassian.servicedesk:company-managed-general-service-project`, `com.atlassian.servicedesk:team-managed-general-service-project`, `com.atlassian.servicedesk:next-gen-it-service-desk`, `com.atlassian.servicedesk:next-gen-hr-service-desk`, `com.atlassian.servicedesk:next-gen-legal-service-desk`, `com.atlassian.servicedesk:next-gen-marketing-service-desk`, `com.atlassian.servicedesk:next-gen-facilities-service-desk`, `com.atlassian.servicedesk:next-gen-analytics-service-desk`, `com.atlassian.servicedesk:next-gen-finance-service-desk`, `com.atlassian.servicedesk:next-gen-design-service-desk`, `com.atlassian.servicedesk:next-gen-sales-service-desk` |

        | `software` | `com.pyxis.greenhopper.jira:gh-simplified-agility-kanban`, `com.pyxis.greenhopper.jira:gh-simplified-agility-scrum`, `com.pyxis.greenhopper.jira:gh-simplified-basic`, `com.pyxis.greenhopper.jira:gh-simplified-kanban-classic`, `com.pyxis.greenhopper.jira:gh-simplified-scrum-classic` |

        | `customer_service` | `com.atlassian.jcs:customer-service-management` |

        The project types are available according to the installed Jira features as follows:


        * Jira Core, the default, enables `business` projects.

        * Jira Service Management enables `service_desk` projects.

        * Jira Software enables `software` projects.


        To determine which features are installed, go to **Jira settings** > **Apps** > **Manage apps** and review the System Apps list. To add Jira Software or Jira Service Management into a JIRA instance, use **Jira settings** > **Apps** > **Finding new apps**. For more information, see Managing add-ons.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: createProject
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              assigneeType: PROJECT_LEAD
              avatarId: 10200
              categoryId: 10120
              description: Cloud migration initiative
              issueSecurityScheme: 10001
              key: EX
              leadAccountId: 5b10a0effa615349cb016cd8
              name: Example
              notificationScheme: 10021
              permissionScheme: 10011
              projectTemplateKey: com.atlassian.jira-core-project-templates:jira-core-simplified-process-control
              projectTypeKey: business
              url: http://atlassian.com
            schema:
              $ref: '#/components/schemas/CreateProjectDetails'
        description: The JSON representation of the project being created.
        required: true
      responses:
        '201':
          content:
            application/json:
              example: '{"id":10010,"key":"EX","self":"https://your-domain.atlassian.net/jira/rest/api/3/project/10042"}'
              schema:
                $ref: '#/components/schemas/ProjectIdentifiers'
          description: Returned if the project is created.
        '400':
          description: Returned if the request is not valid and the project could not be created.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: Returned if the user does not have permission to create projects.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      - {}
      summary: Create project
      tags:
      - Projects
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:project:jira
        - read:project:jira
        state: Beta
      x-atlassian-connect-scope: PROJECT_ADMIN
    servers:
    - url: https://your-domain.atlassian.net
  /rest/api/3/project/recent:
    get:
      deprecated: false
      description: 'Returns a list of up to 20 projects recently viewed by the user that are still visible to the user.


        This operation can be accessed anonymously.


        **Permissions required:** Projects are returned only where the user has one of:


        * *Browse Projects* project permission for the project.

        * *Administer Projects* project permission for the project.

        * *Administer Jira* global permission.'
      operationId: getRecent
      parameters:
      - description: "Use [expand](#expansion) to include additional information in the response. This parameter accepts a comma-separated list. Expanded options include:\n\n *  `description` Returns the project description.\n *  `projectKeys` Returns all project keys associated with a project.\n *  `lead` Returns information about the project lead.\n *  `issueTypes` Returns all issue types associated with the project.\n *  `url` Returns the URL associated with the project.\n *  `permissions` Returns the permissions associated with the project.\n *  `insight` EXPERIMENTAL. Returns the insight details of total issue count and last issue update time for the project.\n *  `*` Returns the project with all available expand options."
        in: query
        name: expand
        schema:
          type: string
      - description: EXPERIMENTAL. A list of project properties to return for the project. This parameter accepts a comma-separated list. Invalid property names are ignored.
        in: query
        name: properties
        schema:
          items:
            $ref: '#/components/schemas/StringList'
          type: array
      responses:
        '200':
          content:
            application/json:
              example: '[{"avatarUrls":{"16x16":"https://your-domain.atlassian.net/secure/projectavatar?size=xsmall&pid=10000","24x24":"https://your-domain.atlassian.net/secure/projectavatar?size=small&pid=10000","32x32":"https://your-domain.atlassian.net/secure/projectavatar?size=medium&pid=10000","48x48":"https://your-domain.atlassian.net/secure/projectavatar?size=large&pid=10000"},"id":"10000","insight":{"lastIssueUpdateTime":1619069825000,"totalIssueCount":100},"key":"EX","name":"Example","projectCategory":{"description":"First Project Category","id":"10000","name":"FIRST","self":"https://your-domain.atlassian.net/rest/api/3/projectCategory/10000"},"self":"https://your-domain.atlassian.net/rest/api/3/project/EX","simplified":false,"style":"CLASSIC"},{"avatarUrls":{"16x16":"https://your-domain.atlassian.net/secure/projectavatar?size=xsmall&pid=10001","24x24":"https://your-domain.atlassian.net/secure/projectavatar?size=small&pid=10001","32x32":"https://your-domain.atlassian.net/secure/projectavatar?size=medium&pid=10001","48x48":"https://your-domain.atlassian.net/secure/projectavatar?size=large&pid=10001"},"id":"10001","insight":{"lastIssueUpdateTime":1619069825000,"totalIssueCount":100},"key":"ABC","name":"Alphabetical","projectCategory":{"description":"First Project Category","id":"10000","name":"FIRST","self":"https://your-domain.atlassian.net/rest/api/3/projectCategory/10000"},"self":"https://your-domain.atlassian.net/rest/api/3/project/ABC","simplified":false,"style":"CLASSIC"}]'
              schema:
                items:
