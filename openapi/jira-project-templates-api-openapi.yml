openapi: 3.2.0
info:
  contact:
    email: ecosystem@atlassian.com
  description: Jira Cloud platform REST API documentation
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://developer.atlassian.com/platform/marketplace/atlassian-developer-terms/
  title: Jira Cloud platform REST Project templates API
  version: 1001.0.0-SNAPSHOT-82b018affa468e58f284fbe4df33536469d757df
servers:
- url: https://your-domain.atlassian.net
tags:
- description: This resource represents project templates. Use it to create a new project from a custom template.
  name: Project Templates
paths:
  /rest/api/3/project-template:
    post:
      deprecated: false
      description: 'Creates a project based on a custom template provided in the request.


        The request body should contain the project details and the capabilities that comprise the project:


        * `details` \- represents the project details settings

        * `template` \- represents a list of capabilities responsible for creating specific parts of a project


        A capability is defined as a unit of configuration for the project you want to create.


        This operation is:


        * asynchronous. Follow the `Location` link in the response header to determine the status of the task and use Get task to obtain subsequent updates.


        ***Note: This API is only supported for Jira Enterprise edition.***


        **Permissions required:** *Administer Jira* global permission.'
      operationId: createProjectWithCustomTemplate
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              details:
                additionalProperties: {}
                assigneeType: PROJECT_LEAD
                avatarId: 1
                categoryId: 1
                currencyCode: USD
                description: description
                enableComponents: false
                key: key
                language: EN-US
                leadAccountId: leadAccountId
                name: name
                projectTypeKey: software
                url: url
                useSystemDefaultPermissionSchemeAndRole: false
              template:
                boardFeatures:
                  boardFeatures:
                    pcri:board:ref:board1:
                    - featureKey: SPRINTS
                      state: true
                boards:
                  boards:
                  - boardFilterJQL: project = 'My Project'
                    cardLayout:
                      showDaysInColumn: true
                    columns:
                    - name: TODO
                      statusIds:
                      - pcri:status:ref:todo
                    name: My Board
                    pcri: pcri:board:ref:board1
                    quickFilters:
                    - description: This is a quick filter for my project
                      jqlQuery: project = 'My Project'
                      name: My Quick Filter
                    supportsSprint: true
                    swimlanes:
                      customSwimlanes:
                      - description: This is a swimlane for my project
                        jqlQuery: project = 'My Project'
                        name: My Swimlane
                      defaultCustomSwimlaneName: My Swimlane
                      swimlaneStrategy: none
                field:
                  customFieldDefinitions:
                  - cfType: com.atlassian.jira.plugin.system.customfieldtypes:textfield
                    description: This is a custom field
                    name: Custom Field 1
                    onConflict: FAIL
                    pcri: pcri:field:ref:customField1
                    searcherKey: com.atlassian.jira.plugin.system.customfieldtypes:textsearcher
                  fieldContexts: []
                  fieldLayoutScheme:
                    defaultFieldLayout: pcri:fieldLayout:ref:fieldLayout1
                    description: This is a field layout scheme
                    explicitMappings:
                      pcri:issueType:ref:default: pcri:fieldLayout:ref:fieldLayout2
                    name: Field Layout Scheme 1
                    pcri: pcri:fieldLayoutScheme:ref:fls1
                  fieldLayouts:
                  - configuration:
                    - pcri: pcri:field:id:summary
                      required: false
                      show: true
                    description: This is a field layout
                    name: Field Layout 1
                    pcri: pcri:fieldLayout:ref:fieldLayout1
                  fieldScheme:
                    description: This is a field scheme
                    items: []
                    name: Field Scheme 1
                    onConflict: USE
                    pcri: pcri:fieldScheme:id:fieldScheme1
                  issueLayouts:
                  - containerId: pcri:issueType:ref:epic
                    issueLayoutType: ISSUE_VIEW
                    items:
                    - itemKey: pcri:field:id:summary
                      properties:
                        jsd.field.displayName: sd.premade.project.servicedesk.common.requesttype.email.field.summary
                      sectionType: content
                      type: FIELD
                    pcri: pcri:issueLayout:ref:issueLayout1
                  issueTypeScreenScheme:
                    defaultScreenScheme: pcri:screenScheme:ref:defaultScreenScheme
                    description: This is an issue type screen scheme
                    explicitMappings:
                      pcri:issueType:ref:issueType1: pcri:screenScheme:ref:screenScheme1
                    name: Issue Type Screen Scheme 1
                    pcri: pcri:issuetypeScreenScheme:ref:issuetypeScreenSchemeRef1
                  projectTemplateSource: LIVE
                  screenScheme:
                  - defaultScreen: pcri:screen:ref:default
                    description: This is a screen scheme
                    explicitMappings:
                      create: pcri:screen:ref:createScreen
                      edit: pcri:screen:ref:editScreen
                      view: pcri:screen:ref:viewScreen
                    name: Screen Scheme 1
                    pcri: pcri:screenScheme:ref:screenScheme1
                  screens:
                  - description: This is a screen
                    name: Screen 1
                    pcri: pcri:screen:ref:screen1
                    tabs:
                    - fields:
                      - pcri:field:ref:field1
                      - pcri:field:ref:field2
                      name: Tab 1
                issueType:
                  issueTypeHierarchy:
                  - hierarchyLevel: 0
                    name: Task issue type hierachy
                    onConflict: USE
                    pcri: pcri:issueTypeHierachy:ref:issueTypeHierachy1
                  issueTypeScheme:
                    defaultIssueTypeId: pcri:issueType:ref:default
                    description: Test Issue Type Scheme description
                    issueTypeIds:
                    - pcri:issueType:ref:default
                    - pcri:issueType:id:10000
                    name: Test Issue Type Scheme
                    pcri: pcri:issueTypeScheme:ref:its
                  issueTypes:
                  - avatarId: 10
                    description: Test issue type description
                    hierarchyLevel: 0
                    name: Test issue type
                    onConflict: USE
                    pcri: pcri:issueType:ref:default
                    permitedOperations:
                      deletable: false
                      editable: true
                notification:
                  description: Description
                  name: Simplified Notification Scheme
                  notificationSchemeEvents:
                  - event:
                      id: '1'
                    notifications:
                    - notificationType: CurrentAssignee
                  onConflict: USE
                  pcri: pcri:notificationScheme:ref:notification1
                permissionScheme:
                  addAddonRole: true
                  description: This is an example permission scheme
                  grants:
                  - applicationAccess: []
                    groupCustomFields: []
                    groups: []
                    permissionKeys:
                    - ADMINISTER_PROJECTS
                    - BROWSE_PROJECTS
                    projectRoles:
                    - pcri:role:ref:admin
                    specialGrants: []
                    userCustomFields: []
                    users: []
                  name: Example Permission Scheme
                  onConflict: USE
                  pcri: pcri:permissionScheme:ref:scheme
                project:
                  fieldLayoutSchemeId: pcri:fieldLayoutScheme:id:10001
                  issueSecuritySchemeId: pcri:issueSecurityScheme:id:10001
                  issueTypeSchemeId: pcri:issueTypeScheme:id:10001
                  issueTypeScreenSchemeId: pcri:issueTypeScreenScheme:id:10001
                  notificationSchemeId: pcri:notificationScheme:id:10001
                  pcri: pcri:project:ref:newProject1
                  permissionSchemeId: pcri:permissionScheme:id:10001
                  projectTypeKey: software
                  workflowSchemeId: pcri:workflowScheme:id:10001
                role:
                  roleToProjectActors:
                    pcri:role:ref:role1:
                    - pcri:user:id:1
                    pcri:role:ref:role2:
                    - pcri:user:id:2
                  roles:
                  - defaultActors:
                    - pcri:user:id:1
                    - pcri:user:id:2
                    description: Administrator role with all permissions
                    name: Admin Role
                    onConflict: FAIL
                    pcri: pcri:role:ref:role1
                    type: EDITABLE
                  - description: Regular user role with limited permissions
                    name: User Role
                    onConflict: FAIL
                    pcri: pcri:role:ref:role2
                    type: VIEWABLE
                scope:
                  type: GLOBAL
                security:
                  description: Newly created issue security scheme
                  name: New Security Scheme
                  pcri: pcri:issueSecurityScheme:ref:newIssueSecurityScheme
                  securityLevels:
                  - description: Newly created issue security level
                    isDefault: true
                    name: New Security Level
                    pcri: pcri:issueSecurityLevel:ref:new-security-level
                    securityLevelMembers:
                    - parameter: administrators
                      type: group
                workflow:
                  statuses:
                  - description: To Do Status
                    name: To Do
                    onConflict: USE
                    pcri: pcri:status:ref:todo
                    statusCategory: TODO
                  - description: In Progress Status
                    name: In Progress
                    onConflict: USE
                    pcri: pcri:status:ref:inprogress
                    statusCategory: IN_PROGRESS
                  - description: Done Status
                    name: Done
                    onConflict: USE
                    pcri: pcri:status:ref:done
                    statusCategory: DONE
                  workflowScheme:
                    defaultWorkflow: pcri:workflow:ref:workflow1
                    description: Description
                    name: New Workflow scheme for Project Custom Template
                    pcri: pcri:workflowScheme:ref:workflowSchemeRef1
                  workflows:
                  - description: a software workflow
                    loopedTransitionContainerLayout:
                      x: 1
                      y: 2
                    name: Software Simplified Workflow for Project
                    onConflict: NEW
                    pcri: pcri:workflow:ref:workflow
                    startPointLayout:
                      x: 1
                      y: 2
                    statuses:
                    - layout:
                        x: 1
                        y: 2
                      pcri: pcri:status:ref:todo
                      properties:
                        key: value
                    transitions:
                    - actions: []
                      description: To do transition
                      from: []
                      id: 11
                      name: To Do
                      properties:
                        jira.i18n.title: gh.workflow.preset.todo
                      to:
                        status: pcri:status:ref:todo
                      triggers: []
                      type: GLOBAL
                      validators: []
                    - actions: []
                      description: In Progress Transition
                      from: []
                      id: 21
                      name: In Progress
                      properties:
                        jira.i18n.title: gh.workflow.preset.inprogress
                      to:
                        status: pcri:status:ref:inprogress
                      triggers: []
                      type: GLOBAL
                      validators: []
                    - actions: []
                      description: Done Transition
                      from: []
                      id: 31
                      name: Done
                      properties:
                        jira.i18n.title: gh.workflow.preset.done
                      to:
                        status: pcri:status:ref:done
                      triggers: []
                      type: GLOBAL
                      validators: []
                    - actions: []
                      description: Start transition
                      from: []
                      id: 1
                      name: Create
                      properties:
                        jira.i18n.title: gh.workflow.preset.todo
                      to:
                        status: pcri:status:ref:todo
                      triggers: []
                      type: INITIAL
                      validators: []
            schema:
              $ref: '#/components/schemas/ProjectCustomTemplateCreateRequestDTO'
        description: The JSON payload containing the project details and capabilities
        required: true
      responses:
        '303':
          content:
            application/json:
              schema: {}
          description: The project creation task has been queued for execution
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Create custom project
      tags:
      - Project Templates
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:project:jira
        - read:project:jira
        state: Beta
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/project-template/edit-template:
    put:
      deprecated: false
      description: 'Edit custom template


        This API endpoint allows you to edit an existing customised template.


        ***Note: Custom Templates are only supported for Jira Enterprise edition.***'
      operationId: editTemplate
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditTemplateRequest'
        description: 'The object containing the updated template details: name, description'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: 200 response
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Edit a custom project template
      tags:
      - Project Templates
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:project:jira
        - read:project:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/project-template/live-template:
    get:
      deprecated: false
      description: 'Get custom template


        This API endpoint allows you to get a live custom project template details by either templateKey or projectId


        ***Note: Custom Templates are only supported for Jira Enterprise edition.***'
      operationId: liveTemplate
      parameters:
      - description: optional - The \{@link String\} containing the project key linked to the custom template to retrieve
        in: query
        name: projectId
        schema:
          type: string
      - description: optional - The \{@link String\} containing the key of the custom template to retrieve
        in: query
        name: templateKey
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectTemplateModel'
          description: 200 response
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Gets a custom project template
      tags:
      - Project Templates
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:project:jira
        - read:project:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/project-template/remove-template:
    delete:
      deprecated: false
      description: 'Remove custom template


        This API endpoint allows you to remove a specified customised template


        ***Note: Custom Templates are only supported for Jira Enterprise edition.***'
      operationId: removeTemplate
      parameters:
      - description: The \{@link String\} containing the key of the custom template to remove
        in: query
        name: templateKey
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: 200 response
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Deletes a custom project template
      tags:
      - Project Templates
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:project:jira
        - read:project:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/project-template/save-template:
    post:
      deprecated: false
      description: 'Save custom template


        This API endpoint allows you to save a customised template


        ***Note: Custom Templates are only supported for Jira Enterprise edition.***'
      operationId: saveTemplate
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTemplateRequest'
        description: 'The object containing the template basic details: name, description'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveTemplateResponse'
          description: 200 response
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Save a custom project template
      tags:
      - Project Templates
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:project:jira
        - read:project:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
components:
  schemas:
    ProjectCustomTemplateCreateRequestDTO:
      additionalProperties: false
      description: Request to create a project using a custom template
      properties:
        details:
          $ref: '#/components/schemas/CustomTemplatesProjectDetails'
        template:
          $ref: '#/components/schemas/CustomTemplateRequestDTO'
      type: object
    FieldLayoutPayload:
      additionalProperties: false
      deprecated: true
      description: Defines the payload for the field layouts. See https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issue-field-configurations/\#api-group-issue-field-configurations" + fieldlayout is what users would see as "Field Configuration" in Jira's UI - https://support.atlassian.com/jira-cloud-administration/docs/manage-issue-field-configurations/
      properties:
        configuration:
          description: The field layout configuration. See https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issue-field-configurations/\#api-rest-api-3-fieldconfiguration-post
          items:
            $ref: '#/components/schemas/FieldLayoutConfiguration'
          type: array
        description:
          description: The description of the field layout
          example: This is a field layout
          type: string
        name:
          description: The name of the field layout
          example: My Field Layout
          type: string
        pcri:
          $ref: '#/components/schemas/ProjectCreateResourceIdentifier'
      type:
      - object
      - 'null'
    FieldCapabilityPayload:
      additionalProperties: false
      description: Defines the payload for the fields, screens, screen schemes, issue type screen schemes, field layouts, and field layout schemes
      properties:
        customFieldDefinitions:
          description: The custom field definitions. See https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issue-fields/\#api-rest-api-3-field-post
          items:
            $ref: '#/components/schemas/CustomFieldPayload'
          type:
          - array
          - 'null'
        fieldLayoutScheme:
          $ref: '#/components/schemas/FieldLayoutSchemePayload'
        fieldLayouts:
          deprecated: true
          description: The field layouts configuration.
          items:
            $ref: '#/components/schemas/FieldLayoutPayload'
          type:
          - array
          - 'null'
        fieldScheme:
          $ref: '#/components/schemas/FieldSchemePayload'
        issueLayouts:
          description: The issue layouts configuration
          items:
            $ref: '#/components/schemas/IssueLayoutPayload'
          type:
          - array
          - 'null'
        issueTypeScreenScheme:
          $ref: '#/components/schemas/IssueTypeScreenSchemePayload'
        screenScheme:
          description: The screen schemes See https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-screen-schemes/\#api-rest-api-3-screenscheme-post
          items:
            $ref: '#/components/schemas/ScreenSchemePayload'
          type:
          - array
          - 'null'
        screens:
          description: The screens. See https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-screens/\#api-rest-api-3-screens-post
          items:
            $ref: '#/components/schemas/ScreenPayload'
          type:
          - array
          - 'null'
      type:
      - object
      - 'null'
    CardLayout:
      additionalProperties: false
      description: Card layout configuration.
      properties:
        showDaysInColumn:
          default: false
          description: Whether to show days in column
          enum:
          - true
          - false
          type: boolean
      type: object
    SecurityLevelMemberPayload:
      additionalProperties: false
      description: The payload for creating a security level member. See https://support.atlassian.com/jira-cloud-administration/docs/configure-issue-security-schemes/
      properties:
        parameter:
          description: Defines the value associated with the type. For reporter this would be \{"null"\}; for users this would be the names of specific users); for group this would be group names like \{"administrators", "jira-administrators", "jira-users"\}
          type: string
        type:
          description: The type of the security level member
          enum:
          - group
          - reporter
          - users
          type: string
      type: object
    WorkflowStatusLayoutPayload:
      additionalProperties: false
      description: The layout of the workflow status.
      properties:
        x:
          description: The x coordinate of the status.
          example: 1
          format: double
          type: number
        y:
          description: The y coordinate of the status.
          example: 2
          format: double
          type: number
      type: object
    IssueLayoutItemPayload:
      additionalProperties: false
      description: Defines the payload to configure the issue layout item for a project.
      properties:
        itemKey:
          $ref: '#/components/schemas/ProjectCreateResourceIdentifier'
        properties:
          additionalProperties:
            description: Additional properties for this item. This field is only used when the type is FIELD.
          description: Additional properties for this item. This field is only used when the type is FIELD.
          type: object
        sectionType:
          description: The item section type
          enum:
          - content
          - primaryContext
          - secondaryContext
          type: string
        type:
          description: The item type. Currently only support FIELD
          enum:
          - FIELD
          type: string
      type: object
    SaveTemplateRequest:
      additionalProperties: false
      description: Request to save a custom template
      properties:
        templateDescription:
          description: The description of the template
          maxLength: 150
          type: string
        templateFromProjectRequest:
          $ref: '#/components/schemas/SaveProjectTemplateRequest'
        templateName:
          description: The name of the template
          maxLength: 50
          type: string
      type: object
    BoardColumnPayload:
      additionalProperties: false
      description: The payload for creating a board column
      properties:
        maximumIssueConstraint:
          description: The maximum issue constraint for the column
          format: int64
          type: integer
        minimumIssueConstraint:
          description: The minimum issue constraint for the column
          format: int64
          type: integer
        name:
          description: The name of the column
          example: TODO
          type: string
        statusIds:
          description: The status IDs for the column
          example: pcri:status:ref:done
          items:
            $ref: '#/components/schemas/ProjectCreateResourceIdentifier'
          type: array
      type: object
    BoardsPayload:
      additionalProperties: false
      properties:
        boards:
          description: The boards to be associated with the project.
          items:
            $ref: '#/components/schemas/BoardPayload'
          type: array
      type:
      - object
      - 'null'
    WorkflowPayload:
      additionalProperties: false
      description: The payload for creating workflow, see https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-workflows/\#api-rest-api-3-workflows-create-post
      properties:
        description:
          description: The description of the workflow
          example: a software workflow
          type: string
        loopedTransitionContainerLayout:
          $ref: '#/components/schemas/WorkflowStatusLayoutPayload'
        name:
          description: The name of the workflow
          example: Software Simplified Workflow
          type: string
        onConflict:
          default: NEW
          description: The strategy to use if there is a conflict with another workflow
          enum:
          - FAIL
          - USE
          - NEW
          type: string
        pcri:
          $ref: '#/components/schemas/ProjectCreateResourceIdentifier'
        startPointLayout:
          $ref: '#/components/schemas/WorkflowStatusLayoutPayload'
        statuses:
          description: The statuses to be used in the workflow
          items:
            $ref: '#/components/schemas/WorkflowStatusPayload'
          type: array
        transitions:
          description: The transitions for the workflow
          items:
            $ref: '#/components/schemas/TransitionPayload'
          type: array
      type: object
    CustomFieldPayload:
      additionalProperties: false
      description: Defines the payload for the custom field definitions. See https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issue-fields/\#api-rest-api-3-field-post
      properties:
        cfType:
          description: The type of the custom field
          example: See https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issue-fields/#api-rest-api-3-field-post `type` for values
          type: string
        description:
          description: The description of the custom field
          example: This is a custom field
          type: string
        name:
          description: The name of the custom field
          example: My Custom Field
          type: string
        onConflict:
          description: The strategy to use when there is a conflict with an existing custom field. FAIL - Fail execution, this always needs to be unique; USE - Use the existing entity and ignore new entity parameters
          enum:
          - FAIL
          - USE
          - NEW
          type: string
        pcri:
          $ref: '#/components/schemas/ProjectCreateResourceIdentifier'
        scope:
          description: Allows an overwrite to declare the new Custom Field to be created as a GLOBAL-scoped field. Leave this as empty or null to use the project's default scope.
          enum:
          - GLOBAL
          - TEMPLATE
          - PROJECT
          type: string
        searcherKey:
          description: The searcher key of the custom field
          example: See https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issue-fields/#api-rest-api-3-field-post `searcherKey` for values
          type: string
      type:
      - object
      - 'null'
    ScopePayload:
      additionalProperties: false
      description: The payload for creating a scope. Defines if a project is team-managed project or company-managed project
      properties:
        type:
          description: The type of the scope. Use `GLOBAL` or empty for company-managed project, and `PROJECT` for team-managed project
          enum:
          - GLOBAL
          - PROJECT
          type: string
      type:
      - object
      - 'null'
    SwimlanesPayload:
      additionalProperties: false
      description: The payload for customising a swimlanes on a board
      properties:
        customSwimlanes:
          description: The custom swimlane definitions.
          items:
            $ref: '#/components/schemas/SwimlanePayload'
