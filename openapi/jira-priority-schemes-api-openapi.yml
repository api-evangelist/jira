openapi: 3.2.0
info:
  contact:
    email: ecosystem@atlassian.com
  description: Jira Cloud platform REST API documentation
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://developer.atlassian.com/platform/marketplace/atlassian-developer-terms/
  title: Jira Cloud platform REST Priority schemes API
  version: 1001.0.0-SNAPSHOT-82b018affa468e58f284fbe4df33536469d757df
servers:
- url: https://your-domain.atlassian.net
tags:
- description: This resource represents issue priority schemes. Use it to get priority schemes and related information, and to create, update and delete priority schemes.
  name: Priority schemes
paths:
  /rest/api/3/priorityscheme:
    get:
      deprecated: false
      description: 'Returns a paginated list of priority schemes.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: getPrioritySchemes
      parameters:
      - description: The index of the first item to return in a page of results (page offset).
        in: query
        name: startAt
        schema:
          default: '0'
          type: string
      - description: The maximum number of items to return per page.
        in: query
        name: maxResults
        schema:
          default: '50'
          type: string
      - description: A set of priority IDs to filter by. To include multiple IDs, provide an ampersand-separated list. For example, `priorityId=10000&priorityId=10001`.
        in: query
        name: priorityId
        schema:
          items:
            format: int64
            type: integer
          type: array
          uniqueItems: true
      - description: A set of priority scheme IDs. To include multiple IDs, provide an ampersand-separated list. For example, `schemeId=10000&schemeId=10001`.
        in: query
        name: schemeId
        schema:
          items:
            format: int64
            type: integer
          type: array
          uniqueItems: true
      - description: The name of scheme to search for.
        in: query
        name: schemeName
        schema:
          default: ''
          type: string
      - description: Whether only the default priority is returned.
        in: query
        name: onlyDefault
        schema:
          default: false
          type: boolean
      - description: The ordering to return the priority schemes by.
        in: query
        name: orderBy
        schema:
          default: +name
          enum:
          - name
          - +name
          - -name
          type: string
      - description: A comma separated list of additional information to return. "priorities" will return priorities associated with the priority scheme. "projects" will return projects associated with the priority scheme. `expand=priorities,projects`.
        in: query
        name: expand
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":true,"maxResults":50,"startAt":0,"total":1,"values":[{"description":"This is the default scheme used by all new and unassigned projects","id":"1","isDefault":true,"name":"Default Priority Scheme","priorities":{"isLast":true,"maxResults":50,"startAt":0,"total":3,"values":[{"description":"Serious problem that could block progress.","iconUrl":"/images/icons/priorities/high.svg","id":"1","isDefault":false,"name":"High","statusColor":"#f15C75"},{"description":"Has the potential to affect progress.","iconUrl":"/images/icons/priorities/medium.svg","id":"2","isDefault":true,"name":"Medium","statusColor":"#f79232"},{"description":"Minor problem or easily worked around.","iconUrl":"/images/icons/priorities/low.svg","id":"3","isDefault":false,"name":"Low","statusColor":"#707070"}]},"projects":{"isLast":true,"maxResults":50,"startAt":0,"total":1,"values":[{"avatarUrls":{"16x16":"secure/projectavatar?size=xsmall&pid=10000","24x24":"secure/projectavatar?size=small&pid=10000","32x32":"secure/projectavatar?size=medium&pid=10000","48x48":"secure/projectavatar?size=large&pid=10000"},"id":"10000","key":"EX","name":"Example","projectCategory":{"description":"Project category description","id":"10000","name":"A project category"},"projectTypeKey":"ProjectTypeKey{key=''software''}","self":"project/EX","simplified":false}]}}]}'
              schema:
                $ref: '#/components/schemas/PageBeanPrioritySchemeWithPaginatedPrioritiesAndProjects'
          description: Returned if the request is successful.
        '400':
          description: Returned if the request isn't valid.
        '401':
          description: Returned if the authentication credentials are incorrect.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Get priority schemes
      tags:
      - Priority schemes
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - read:priority-scheme:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
    post:
      deprecated: false
      description: 'Creates a new priority scheme.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: createPriorityScheme
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              defaultPriorityId: 10001
              description: My priority scheme description
              mappings:
                in:
                  '10002': 10000
                  '10005': 10001
                  '10006': 10001
                  '10008': 10003
                out: {}
              name: My new priority scheme
              priorityIds:
              - 10000
              - 10001
              - 10003
              projectIds:
              - 10005
              - 10006
              - 10007
            schema:
              $ref: '#/components/schemas/CreatePrioritySchemeDetails'
        required: true
      responses:
        '201':
          content:
            application/json:
              example: '{"id":"10001"}'
              schema:
                $ref: '#/components/schemas/PrioritySchemeId'
          description: Returned if the request is completed.
        '202':
          content:
            application/json:
              example: '{"id":"10001","task":{"self":"https://your-domain.atlassian.net/rest/api/3/task/1","id":"1","description":"Task description","status":"COMPLETE","result":"the task result, this may be any JSON","submittedBy":10000,"progress":100,"elapsedRuntime":156,"submitted":1501708132800,"started":1501708132900,"finished":1501708133000,"lastUpdate":1501708133000}}'
              schema:
                $ref: '#/components/schemas/PrioritySchemeId'
          description: Returned if the request is accepted.
        '400':
          description: "Returned if the request isn't valid.\n\n**Mappings Validation Errors**\n\n *  ``The priorities with IDs [ID 1, ID 2, ...] require mapping. Please provide mappings in the 'in' mappings object, where these priorities are the keys with corresponding values.`` The listed priority ID(s) have not been provided as keys for ``in`` mappings but are required, add them to the mappings object."
        '401':
          description: Returned if the authentication credentials are incorrect.
        '403':
          description: Returned if the user doesn't have the necessary permissions.
        '409':
          description: Returned if an action with this priority scheme is still in progress.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitExceededResponseBean'
          description: 422 response
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Create priority scheme
      tags:
      - Priority schemes
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:priority-scheme:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/priorityscheme/mappings:
    post:
      deprecated: false
      description: 'Returns a paginated list of priorities that would require mapping, given a change in priorities or projects associated with a priority scheme.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: suggestedPrioritiesForMappings
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              maxResults: 50
              priorities:
                add:
                - 10001
                - 10002
                remove:
                - 10003
              projects:
                add:
                - 10021
              schemeId: 10005
              startAt: 0
            schema:
              $ref: '#/components/schemas/SuggestedMappingsRequestBean'
        required: true
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":true,"maxResults":50,"startAt":0,"total":3,"values":[{"description":"Serious problem that could block progress.","iconUrl":"/images/icons/priorities/high.svg","id":"1","isDefault":false,"name":"High","statusColor":"#f15C75"},{"description":"Has the potential to affect progress.","iconUrl":"/images/icons/priorities/medium.svg","id":"2","isDefault":true,"name":"Medium","statusColor":"#f79232"},{"description":"Minor problem or easily worked around.","iconUrl":"/images/icons/priorities/low.svg","id":"3","isDefault":false,"name":"Low","statusColor":"#707070"}]}'
              schema:
                $ref: '#/components/schemas/PageBeanPriorityWithSequence'
          description: Returned if the request is successful.
        '400':
          description: Returned if the request isn't valid.
        '401':
          description: Returned if the authentication credentials are incorrect.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Suggested priorities for mappings
      tags:
      - Priority schemes
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - read:priority-scheme:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/priorityscheme/priorities/available:
    get:
      deprecated: false
      description: 'Returns a paginated list of priorities available for adding to a priority scheme.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: getAvailablePrioritiesByPriorityScheme
      parameters:
      - description: The index of the first item to return in a page of results (page offset).
        in: query
        name: startAt
        schema:
          default: '0'
          type: string
      - description: The maximum number of items to return per page.
        in: query
        name: maxResults
        schema:
          default: '50'
          type: string
      - description: The string to query priorities on by name.
        in: query
        name: query
        schema:
          default: ''
          type: string
      - description: The priority scheme ID.
        in: query
        name: schemeId
        required: true
        schema:
          type: string
      - description: A list of priority IDs to exclude from the results.
        in: query
        name: exclude
        schema:
          items:
            type: string
          type: array
          uniqueItems: true
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":true,"maxResults":50,"startAt":0,"total":3,"values":[{"description":"Serious problem that could block progress.","iconUrl":"/images/icons/priorities/high.svg","id":"1","isDefault":false,"name":"High","statusColor":"#f15C75"},{"description":"Has the potential to affect progress.","iconUrl":"/images/icons/priorities/medium.svg","id":"2","isDefault":true,"name":"Medium","statusColor":"#f79232"},{"description":"Minor problem or easily worked around.","iconUrl":"/images/icons/priorities/low.svg","id":"3","isDefault":false,"name":"Low","statusColor":"#707070"}]}'
              schema:
                $ref: '#/components/schemas/PageBeanPriorityWithSequence'
          description: Returned if the request is successful.
        '400':
          description: Returned if the request isn't valid.
        '401':
          description: Returned if the authentication credentials are incorrect.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Get available priorities by priority scheme
      tags:
      - Priority schemes
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - read:priority-scheme:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/priorityscheme/{schemeId}:
    delete:
      deprecated: false
      description: 'Deletes a priority scheme.


        This operation is only available for priority schemes without any associated projects. Any associated projects must be removed from the priority scheme before this operation can be performed.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: deletePriorityScheme
      parameters:
      - description: The priority scheme ID.
        in: path
        name: schemeId
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: Returned if the request is successful.
        '400':
          description: Returned if the request isn't valid.
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: Returned if the user doesn't have the necessary permissions.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Delete priority scheme
      tags:
      - Priority schemes
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - delete:priority-scheme:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
    put:
      deprecated: false
      description: 'Updates a priority scheme. This includes its details, the lists of priorities and projects in it


        **Permissions required:** *Administer Jira* global permission.'
      operationId: updatePriorityScheme
      parameters:
      - description: The ID of the priority scheme.
        in: path
        name: schemeId
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            example:
              defaultPriorityId: 10001
              description: My priority scheme description
              mappings:
                in:
                  '10003': 10002
                  '10004': 10001
                out:
                  '10001': 10005
                  '10002': 10006
              name: My new priority scheme
              priorities:
                add:
                  ids:
                  - 10001
                  - 10002
                remove:
                  ids:
                  - 10003
                  - 10004
              projects:
                add:
                  ids:
                  - 10101
                  - 10102
                remove:
                  ids:
                  - 10103
                  - 10104
            schema:
              $ref: '#/components/schemas/UpdatePrioritySchemeRequestBean'
        required: true
      responses:
        '202':
          content:
            application/json:
              example: '{"task":{"self":"https://your-domain.atlassian.net/rest/api/3/task/1","id":"1","description":"Task description","status":"COMPLETE","result":"the task result, this may be any JSON","submittedBy":10000,"progress":100,"elapsedRuntime":156,"submitted":1501708132800,"started":1501708132900,"finished":1501708133000,"lastUpdate":1501708133000},"updated":{"description":"This is the default scheme used by all new and unassigned projects","id":"1","isDefault":true,"name":"Default Priority Scheme","priorities":{"isLast":true,"maxResults":50,"startAt":0,"total":3,"values":[{"description":"Serious problem that could block progress.","iconUrl":"/images/icons/priorities/high.svg","id":"1","isDefault":false,"name":"High","statusColor":"#f15C75"},{"description":"Has the potential to affect progress.","iconUrl":"/images/icons/priorities/medium.svg","id":"2","isDefault":true,"name":"Medium","statusColor":"#f79232"},{"description":"Minor problem or easily worked around.","iconUrl":"/images/icons/priorities/low.svg","id":"3","isDefault":false,"name":"Low","statusColor":"#707070"}]},"projects":{"isLast":true,"maxResults":50,"startAt":0,"total":1,"values":[{"avatarUrls":{"16x16":"secure/projectavatar?size=xsmall&pid=10000","24x24":"secure/projectavatar?size=small&pid=10000","32x32":"secure/projectavatar?size=medium&pid=10000","48x48":"secure/projectavatar?size=large&pid=10000"},"id":"10000","key":"EX","name":"Example","projectCategory":{"description":"Project category description","id":"10000","name":"A project category"},"projectTypeKey":"ProjectTypeKey{key=''software''}","self":"project/EX","simplified":false}]}}}'
              schema:
                $ref: '#/components/schemas/UpdatePrioritySchemeResponseBean'
          description: Returned if the request is accepted.
        '400':
          description: "Returned if the request isn't valid.\n\n**Mappings Validation Errors**\n\n *  ``The changes to priority schemes require mapping of priorities. Please provide a value for the 'in' mappings object.`` Priorities are being removed and/or projects are being added to the scheme, but ``in`` mappings are not provided.\n *  ``The changes to priority schemes require mapping of priorities. Please provide a value for the 'out' mappings object.`` Projects are being removed from the scheme, but ``out`` mappings are not provided.\n *  ``The priorities with IDs [ID 1, ID 2, ...] provided as keys for the 'in' mappings object do not exist. Please provide existing priority IDs.`` The listed priority ID(s) have been provided as keys for ``in`` mappings but do not exist. Please confirm the correct priority ID(s) have been provided, they should be priorities that exist on the Jira site which are used by projects being added to the current scheme, but are not in use by the current scheme.\n *  ``The priorities with IDs [ID 1, ID 2, ...] provided as values for the 'in' mappings object do not exist. Please provide existing priority IDs used by the current priority scheme.`` The listed priority ID(s) have been provided as values for ``in`` mappings but do not exist. Please confirm the correct priority ID(s) have been provided, they should be priorities that exist on the Jira site and are in use by the current scheme.\n *  ``The priorities with IDs [ID 1, ID 2, ...] provided as keys for the 'out' mappings object do not exist. Please provide existing priority IDs used by the current priority scheme.`` The listed priority ID(s) have been provided as keys for ``out`` mappings but are invalid. Please confirm the correct priority ID(s) have been provided, they should be priorities that exist on the Jira site and are in use by the current scheme.\n *  ``The priorities with IDs [ID 1, ID 2, ...] provided as values for the 'out' mappings object do not exist. Please provide existing priority IDs used by the default scheme.`` The listed priority ID(s) have been provided as values for ``out`` mappings but are invalid. Please confirm the correct priority ID(s) have been provided, they should be priorities that exist on the Jira site and are in use by the Default Priority Scheme, but are not in use by the current scheme.\n *  ``The priorities with IDs [ID 1, ID 2, ...] do not require mapping. Please remove these keys and their corresponding values from the 'in' mappings object.`` The listed priority ID(s) have been provided as keys for ``in`` mappings but are not required, they can be removed from the mappings object.\n *  ``The priorities with IDs [ID 1, ID 2, ...] require mapping. Please provide mappings in the 'in' mappings object, where these priorities are the keys with corresponding values.`` The listed priority ID(s) have not been provided as keys for ``in`` mappings but are required, add them to the mappings object.\n *  ``The priorities with IDs [ID 1, ID 2, ...] being mapped to are not in the current scheme. Please remove these values and their corresponding keys from the 'in' mappings object.`` The listed priority ID(s) have been provided as keys for ``in`` mappings but are not in use by the current scheme, they can be removed from the mappings object.\n *  ``The priorities with IDs [ID 1, ID 2, ...] do not require mapping. Please remove these keys and their corresponding values from the 'out' mappings object.`` The listed priority ID(s) hve been provided as keys for ``out`` mappings but are not required, they can be removed from the mappings object.\n *  ``The priorities with IDs [ID 1, ID 2, ...] require mapping. Please provide mappings in the 'out' mappings object, where these priorities are the keys with corresponding values.`` The listed priority ID(s) have not been provided as keys for ``out`` mappings but are required, add them to the mappings object.\n *  ``The priorities with IDs [ID 1, ID 2, ...] being mapped to are not in the default scheme. Please remove these values and their corresponding keys from the 'out' mappings object.`` The listed priority ID(s) have been provided as keys for ``out`` mappings but are not in use by the Default Priority Scheme, they can be removed from the mappings object."
        '401':
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          description: Returned if the user doesn't have the necessary permissions.
        '409':
          description: Returned if an action with this priority scheme is still in progress.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitExceededResponseBean'
          description: 422 response
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Update priority scheme
      tags:
      - Priority schemes
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:priority-scheme:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/priorityscheme/{schemeId}/priorities:
    get:
      deprecated: false
      description: 'Returns a paginated list of priorities by scheme.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: getPrioritiesByPriorityScheme
      parameters:
      - description: The index of the first item to return in a page of results (page offset).
        in: query
        name: startAt
        schema:
          default: '0'
          type: string
      - description: The maximum number of items to return per page.
        in: query
        name: maxResults
        schema:
          default: '50'
          type: string
      - description: The priority scheme ID.
        in: path
        name: schemeId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":true,"maxResults":50,"startAt":0,"total":3,"values":[{"description":"Serious problem that could block progress.","iconUrl":"/images/icons/priorities/high.svg","id":"1","isDefault":false,"name":"High","statusColor":"#f15C75"},{"description":"Has the potential to affect progress.","iconUrl":"/images/icons/priorities/medium.svg","id":"2","isDefault":true,"name":"Medium","statusColor":"#f79232"},{"description":"Minor problem or easily worked around.","iconUrl":"/images/icons/priorities/low.svg","id":"3","isDefault":false,"name":"Low","statusColor":"#707070"}]}'
              schema:
                $ref: '#/components/schemas/PageBeanPriorityWithSequence'
          description: Returned if the request is successful.
        '400':
          description: Returned if the request isn't valid.
        '401':
          description: Returned if the authentication credentials are incorrect.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Get priorities by priority scheme
      tags:
      - Priority schemes
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - read:priority-scheme:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/priorityscheme/{schemeId}/projects:
    get:
      deprecated: false
      description: 'Returns a paginated list of projects by scheme.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: getProjectsByPriorityScheme
      parameters:
      - description: The index of the first item to return in a page of results (page offset).
        in: query
        name: startAt
        schema:
          default: '0'
          type: string
      - description: The maximum number of items to return per page.
        in: query
        name: maxResults
        schema:
          default: '50'
          type: string
      - description: The project IDs to filter by. For example, `projectId=10000&projectId=10001`.
        in: query
        name: projectId
        schema:
          items:
            format: int64
            type: integer
          type: array
          uniqueItems: true
      - description: The priority scheme ID.
        in: path
        name: schemeId
        required: true
        schema:
          type: string
      - description: The string to query projects on by name.
        in: query
        name: query
        schema:
          default: ''
          type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":true,"maxResults":50,"startAt":0,"total":1,"values":[{"avatarUrls":{"16x16":"secure/projectavatar?size=xsmall&pid=10000","24x24":"secure/projectavatar?size=small&pid=10000","32x32":"secure/projectavatar?size=medium&pid=10000","48x48":"secure/projectavatar?size=large&pid=10000"},"id":"10000","key":"EX","name":"Example","projectCategory":{"description":"Project category description","id":"10000","name":"A project category"},"projectTypeKey":"ProjectTypeKey{key=''software''}","self":"project/EX","simplified":false}]}'
              schema:
                $ref: '#/components/schemas/PageBeanProject'
          description: Returned if the request is successful.
        '400':
          description: Returned if the request isn't valid.
        '401':
          description: Returned if the authentication credentials are incorrect.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Get projects by priority scheme
      tags:
      - Priority schemes
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - read:priority-scheme:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
components:
  schemas:
    PageBeanPriorityWithSequence:
      additionalProperties: false
      description: A page of items.
      properties:
        isLast:
          description: Whether this is the last page.
          readOnly: true
          type: boolean
        maxResults:
          description: The maximum number of items that could be returned.
          format: int32
          readOnly: true
          type: integer
        nextPage:
          description: If there is another page of results, the URL of the next page.
          format: uri
          readOnly: true
          type: string
        self:
          description: The URL of the page.
          format: uri
          readOnly: true
          type: string
        startAt:
          description: The index of the first item returned.
          format: int64
          readOnly: true
          type: integer
        total:
          description: The number of items returned.
