openapi: 3.2.0
info:
  contact:
    url: https://getsupport.atlassian.com
  description: Jira Software Cloud REST API documentation
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://atlassian.com/terms/
  title: Jira Software Cloud Board API
  version: 1001.0.0
servers:
- url: https://your-domain.atlassian.net
tags:
- description: Apis related to boards
  name: Board
paths:
  /rest/agile/1.0/board:
    get:
      deprecated: false
      description: 'Returns all boards. This only includes boards that the user has permission to view.


        **Deprecation notice:** The required OAuth 2.0 scopes will be updated on February 15, 2024.


        * `read:board-scope:jira-software`, `read:project:jira`'
      operationId: getAllBoards
      parameters:
      - description: 'The starting index of the returned boards. Base index: 0. See the ''Pagination'' section at the top of this page for more details.'
        in: query
        name: startAt
        schema:
          default: 0
          format: int64
          type: integer
      - description: The maximum number of boards to return per page. See the 'Pagination' section at the top of this page for more details.
        in: query
        name: maxResults
        schema:
          default: 50
          format: int32
          type: integer
      - description: 'Filters results to boards of the specified types. Valid values: scrum, kanban, simple.'
        in: query
        name: type
        schema:
          additionalProperties: false
          type: object
      - description: Filters results to boards that match or partially match the specified name.
        in: query
        name: name
        schema:
          type: string
      - description: Filters results to boards that are relevant to a project. Relevance means that the jql filter defined in board contains a reference to a project.
        in: query
        name: projectKeyOrId
        schema:
          type: string
      - in: query
        name: accountIdLocation
        schema:
          type: string
      - in: query
        name: projectLocation
        schema:
          type: string
      - description: Appends private boards to the end of the list. The name and type fields are excluded for security reasons.
        in: query
        name: includePrivate
        schema:
          type: boolean
      - description: If set to true, negate filters used for querying by location. By default false.
        in: query
        name: negateLocationFiltering
        schema:
          type: boolean
      - description: 'Ordering of the results by a given field. If not provided, values will not be sorted. Valid values: name.'
        in: query
        name: orderBy
        schema:
          enum:
          - name
          - -name
          - +name
          type: string
      - description: 'List of fields to expand for each board. Valid values: admins, permissions.'
        in: query
        name: expand
        schema:
          type: string
      - description: 'Filters results to boards that are relevant to a project types. Support Jira Software, Jira Service Management. Valid values: software, service\_desk. By default software.'
        in: query
        name: projectTypeLocation
        schema:
          items:
            default: ''
            type: string
          type: array
      - description: Filters results to boards that are relevant to a filter. Not supported for next-gen boards.
        in: query
        name: filterId
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":false,"maxResults":2,"startAt":1,"total":5,"values":[{"id":84,"name":"scrum board","self":"https://your-domain.atlassian.net/rest/agile/1.0/board/84","type":"scrum"},{"id":92,"name":"kanban board","self":"https://your-domain.atlassian.net/rest/agile/1.0/board/92","type":"kanban"}]}'
              schema:
                additionalProperties: false
                properties:
                  isLast:
                    type: boolean
                  maxResults:
                    format: int32
                    type: integer
                  startAt:
                    format: int64
                    type: integer
                  total:
                    format: int64
                    type: integer
                  values:
                    items:
                      additionalProperties: false
                      description: Details about a board.
                      properties:
                        admins:
                          allOf:
                          - additionalProperties: false
                            description: The users and groups who own the board.
                            properties:
                              groups:
                                items:
                                  additionalProperties: false
                                  properties:
                                    name:
                                      type: string
                                    self:
                                      format: uri
                                      type: string
                                  type: object
                                type: array
                              users:
                                items:
                                  additionalProperties: false
                                  properties:
                                    accountId:
                                      description: The account ID of the user, which uniquely identifies the user across all Atlassian products. For example, *5b10ac8d82e05b22cc7d4ef5*.
                                      maxLength: 128
                                      type: string
                                    active:
                                      description: Whether the user is active.
                                      type: boolean
                                    avatarUrls:
                                      allOf:
                                      - additionalProperties: false
                                        properties:
                                          16x16:
                                            description: The URL of the user's 16x16 pixel avatar.
                                            format: uri
                                            type: string
                                          24x24:
                                            description: The URL of the user's 24x24 pixel avatar.
                                            format: uri
                                            type: string
                                          32x32:
                                            description: The URL of the user's 32x32 pixel avatar.
                                            format: uri
                                            type: string
                                          48x48:
                                            description: The URL of the user's 48x48 pixel avatar.
                                            format: uri
                                            type: string
                                        type: object
                                      description: The avatars of the user.
                                    displayName:
                                      description: The display name of the user. Depending on the user’s privacy setting, this may return an alternative value.
                                      type: string
                                    key:
                                      description: "This property is deprecated in favor of `accountId` because of privacy changes. See the [migration guide](https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-user-privacy-api-migration-guide/) for details.  \nThe key of the user."
                                      type: string
                                    name:
                                      description: "This property is deprecated in favor of `accountId` because of privacy changes. See the [migration guide](https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-user-privacy-api-migration-guide/) for details.  \nThe username of the user."
                                      type: string
                                    self:
                                      description: The URL of the user.
                                      format: uri
                                      type: string
                                  type: object
                                type: array
                            type: object
                          readOnly: true
                        canEdit:
                          description: Whether the board can be edited.
                          readOnly: true
                          type: boolean
                        favourite:
                          description: Whether the board is selected as a favorite.
                          readOnly: true
                          type: boolean
                        id:
                          description: The ID of the board.
                          format: int64
                          type: integer
                        isPrivate:
                          description: Whether the board is private.
                          readOnly: true
                          type: boolean
                        location:
                          additionalProperties: false
                          description: The container that the board is located in.
                          properties:
                            avatarURI:
                              format: uri
                              type: string
                            displayName:
                              type: string
                            name:
                              type: string
                            projectId:
                              format: int64
                              type: integer
                            projectKey:
                              type: string
                            projectName:
                              type: string
                            projectTypeKey:
                              type: string
                            userAccountId:
                              type: string
                            userId:
                              format: int64
                              type: integer
                          type: object
                        name:
                          description: The name of the board.
                          type: string
                        self:
                          description: The URL of the board.
                          format: uri
                          readOnly: true
                          type: string
                        type:
                          description: The type the board.
                          type: string
                      type: object
                    type: array
                type: object
          description: Returns the requested boards, at the specified page of the results.
        '400':
          description: Returned if the request is invalid.
        '401':
          description: Returned if the user is not logged in.
        '403':
          description: Returned if the user does not have valid license.
      security:
      - basicAuth: []
      - OAuth2:
        - read:board-scope:jira-software
        - read:project:jira
      summary: Get all boards
      tags:
      - Board
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: READ
    post:
      deprecated: false
      description: 'Creates a new board. Board name, type and filter ID is required.


        * `name` \- Must be less than 255 characters.

        * `type` \- Valid values: scrum, kanban

        * `filterId` \- ID of a filter that the user has permissions to view. Note, if the user does not have the ''Create shared objects'' permission and tries to create a shared board, a private board will be created instead (remember that board sharing depends on the filter sharing).

        * `location` \- The container that the board will be located in. `location` must include the `type` property (Valid values: project, user). If choosing ''project'', then a project must be specified by a `projectKeyOrId` property in `location`. If choosing ''user'', the current user is chosen by default. The `projectKeyOrId` property should not be provided.


        Note:


        * If you want to create a new project with an associated board, use the Jira platform REST API. For more information, see the Create project method. The `projectTypeKey` for software boards must be ''software'' and the `projectTemplateKey` must be either `com.pyxis.greenhopper.jira:gh-kanban-template` or `com.pyxis.greenhopper.jira:gh-scrum-template`.

        * You can create a filter using the Jira REST API. For more information, see the Create filter method.

        * If you do not ORDER BY the Rank field for the filter of your board, you will not be able to reorder issues on the board.'
      operationId: createBoard
      requestBody:
        content:
          application/json:
            example:
              filterId: 10040
              location:
                projectKeyOrId: '10000'
                type: project
              name: scrum board
              type: scrum
            schema:
              additionalProperties: false
              properties:
                filterId:
                  format: int64
                  type: integer
                location:
                  additionalProperties: false
                  properties:
                    projectKeyOrId:
                      type: string
                    type:
                      enum:
                      - project
                      - user
                      type: string
                  type: object
                name:
                  type: string
                type:
                  enum:
                  - kanban
                  - scrum
                  - agility
                  type: string
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              example: '{"id":84,"name":"scrum board","self":"https://your-domain.atlassian.net/rest/agile/1.0/board/84","type":"scrum"}'
              schema:
                additionalProperties: false
                description: Details about a board.
                properties:
                  admins:
                    allOf:
                    - additionalProperties: false
                      description: The users and groups who own the board.
                      properties:
                        groups:
                          items:
                            additionalProperties: false
                            properties:
                              name:
                                type: string
                              self:
                                format: uri
                                type: string
                            type: object
                          type: array
                        users:
                          items:
                            additionalProperties: false
                            properties:
                              accountId:
                                description: The account ID of the user, which uniquely identifies the user across all Atlassian products. For example, *5b10ac8d82e05b22cc7d4ef5*.
                                maxLength: 128
                                type: string
                              active:
                                description: Whether the user is active.
                                type: boolean
                              avatarUrls:
                                allOf:
                                - additionalProperties: false
                                  properties:
                                    16x16:
                                      description: The URL of the user's 16x16 pixel avatar.
                                      format: uri
                                      type: string
                                    24x24:
                                      description: The URL of the user's 24x24 pixel avatar.
                                      format: uri
                                      type: string
                                    32x32:
                                      description: The URL of the user's 32x32 pixel avatar.
                                      format: uri
                                      type: string
                                    48x48:
                                      description: The URL of the user's 48x48 pixel avatar.
                                      format: uri
                                      type: string
                                  type: object
                                description: The avatars of the user.
                              displayName:
                                description: The display name of the user. Depending on the user’s privacy setting, this may return an alternative value.
                                type: string
                              key:
                                description: "This property is deprecated in favor of `accountId` because of privacy changes. See the [migration guide](https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-user-privacy-api-migration-guide/) for details.  \nThe key of the user."
                                type: string
                              name:
                                description: "This property is deprecated in favor of `accountId` because of privacy changes. See the [migration guide](https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-user-privacy-api-migration-guide/) for details.  \nThe username of the user."
                                type: string
                              self:
                                description: The URL of the user.
                                format: uri
                                type: string
                            type: object
                          type: array
                      type: object
                    readOnly: true
                  canEdit:
                    description: Whether the board can be edited.
                    readOnly: true
                    type: boolean
                  favourite:
                    description: Whether the board is selected as a favorite.
                    readOnly: true
                    type: boolean
                  id:
                    description: The ID of the board.
                    format: int64
                    type: integer
                  isPrivate:
                    description: Whether the board is private.
                    readOnly: true
                    type: boolean
                  location:
                    additionalProperties: false
                    description: The container that the board is located in.
                    properties:
                      avatarURI:
                        format: uri
                        type: string
                      displayName:
                        type: string
                      name:
                        type: string
                      projectId:
                        format: int64
                        type: integer
                      projectKey:
                        type: string
                      projectName:
                        type: string
                      projectTypeKey:
                        type: string
                      userAccountId:
                        type: string
                      userId:
                        format: int64
                        type: integer
                    type: object
                  name:
                    description: The name of the board.
                    type: string
                  self:
                    description: The URL of the board.
                    format: uri
                    readOnly: true
                    type: string
                  type:
                    description: The type the board.
                    type: string
                type: object
          description: Returns the created board.
        '400':
          description: Returned if the request is invalid.
        '401':
          description: Returned if the user is not logged in.
        '403':
          description: Returned if the user does not have a valid license.
      security:
      - basicAuth: []
      - OAuth2:
        - write:board-scope:jira-software
      summary: Create board
      tags:
      - Board
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: WRITE
  /rest/agile/1.0/board/filter/{filterId}:
    get:
      deprecated: false
      description: Returns any boards which use the provided filter id. This method can be executed by users without a valid software license in order to find which boards are using a particular filter.
      operationId: getBoardByFilterId
      parameters:
      - description: 'The starting index of the returned boards. Base index: 0. See the ''Pagination'' section at the top of this page for more details.'
        in: query
        name: startAt
        schema:
          format: int64
          type: integer
      - description: 'The maximum number of boards to return per page. Default: 50. See the ''Pagination'' section at the top of this page for more details.'
        in: query
        name: maxResults
        schema:
          format: int32
          type: integer
      - description: Filters results to boards that are relevant to a filter. Not supported for next-gen boards.
        in: path
        name: filterId
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              example: '{"id":84,"name":"scrum board","self":"https://your-domain.atlassian.net/rest/agile/1.0/board/84"}'
              schema:
                additionalProperties: false
                properties:
                  isLast:
                    type: boolean
                  maxResults:
                    format: int32
                    type: integer
                  startAt:
                    format: int64
                    type: integer
                  total:
                    format: int64
                    type: integer
                  values:
                    items:
                      additionalProperties: false
                      properties:
                        id:
                          format: int64
                          type: integer
                        name:
                          type: string
                        self:
                          format: uri
                          type: string
                      type: object
                    type: array
                type: object
          description: Returns the requested boards, at the specified page of the results.
        '400':
          description: Returned if the request is invalid.
        '401':
          description: Returned if the user is not logged in.
      security:
      - basicAuth: []
      - OAuth2:
        - read:board-scope.admin:jira-software
      summary: Get board by filter id
      tags:
      - Board
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: READ
  /rest/agile/1.0/board/{boardId}:
    delete:
      deprecated: false
      description: Deletes the board. Admin without the view permission can still remove the board.
      operationId: deleteBoard
      parameters:
      - description: ID of the board to be deleted
        in: path
        name: boardId
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '204':
          description: Returned if the board has been successfully removed.
        '403':
          description: Returned if the user does not have a valid license, or when the user does not have the permission to delete the board, or when the user tried to delete a next-gen board. The user has to be a Jira Administrator or a board administrator to remove the board. Next-gen boards cannot be deleted, because next-gen software projects must have a board.
        '404':
          description: Returned if a board with the given ID does not exist or the user does not have the permission to view the board.
      security:
      - basicAuth: []
      - OAuth2:
        - write:board-scope:jira-software
      summary: Delete board
      tags:
      - Board
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: DELETE
    get:
      deprecated: false
      description: Returns the board for the given board ID. This board will only be returned if the user has permission to view it. Admins without the view permission will see the board as a private one, so will see only a subset of the board's data (board location for instance).
      operationId: getBoard
      parameters:
      - description: The ID of the requested board.
        in: path
        name: boardId
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              example: '{"id":84,"location":{"displayName":"Example Project","name":"Example Project","projectId":10040,"projectKey":"Example Project Key","projectName":"Example Project","projectTypeKey":"KEY","userAccountId":"5b10a2844c20165700ede21g","userId":10040},"name":"scrum board","self":"https://your-domain.atlassian.net/rest/agile/1.0/board/84","type":"scrum"}'
              schema:
                additionalProperties: false
                description: Details about a board.
                properties:
                  admins:
                    allOf:
                    - additionalProperties: false
                      description: The users and groups who own the board.
                      properties:
                        groups:
                          items:
                            additionalProperties: false
                            properties:
                              name:
                                type: string
                              self:
                                format: uri
                                type: string
                            type: object
                          type: array
                        users:
                          items:
                            additionalProperties: false
                            properties:
                              accountId:
                                description: The account ID of the user, which uniquely identifies the user across all Atlassian products. For example, *5b10ac8d82e05b22cc7d4ef5*.
                                maxLength: 128
                                type: string
                              active:
                                description: Whether the user is active.
                                type: boolean
                              avatarUrls:
                                allOf:
                                - additionalProperties: false
                                  properties:
                                    16x16:
                                      description: The URL of the user's 16x16 pixel avatar.
                                      format: uri
                                      type: string
                                    24x24:
                                      description: The URL of the user's 24x24 pixel avatar.
                                      format: uri
                                      type: string
                                    32x32:
                                      description: The URL of the user's 32x32 pixel avatar.
                                      format: uri
                                      type: string
                                    48x48:
                                      description: The URL of the user's 48x48 pixel avatar.
                                      format: uri
                                      type: string
                                  type: object
                                description: The avatars of the user.
                              displayName:
                                description: The display name of the user. Depending on the user’s privacy setting, this may return an alternative value.
                                type: string
                              key:
                                description: "This property is deprecated in favor of `accountId` because of privacy changes. See the [migration guide](https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-user-privacy-api-migration-guide/) for details.  \nThe key of the user."
                                type: string
                              name:
                                description: "This property is deprecated in favor of `accountId` because of privacy changes. See the [migration guide](https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-user-privacy-api-migration-guide/) for details.  \nThe username of the user."
                                type: string
                              self:
                                description: The URL of the user.
                                format: uri
                                type: string
                            type: object
                          type: array
                      type: object
                    readOnly: true
                  canEdit:
                    description: Whether the board can be edited.
                    readOnly: true
                    type: boolean
                  favourite:
                    description: Whether the board is selected as a favorite.
                    readOnly: true
                    type: boolean
                  id:
                    description: The ID of the board.
                    format: int64
                    type: integer
                  isPrivate:
                    description: Whether the board is private.
                    readOnly: true
                    type: boolean
                  location:
                    additionalProperties: false
                    description: The container that the board is located in.
                    properties:
                      avatarURI:
                        format: uri
                        type: string
                      displayName:
                        type: string
                      name:
                        type: string
                      projectId:
                        format: int64
