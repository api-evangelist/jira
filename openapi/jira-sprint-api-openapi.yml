openapi: 3.2.0
info:
  contact:
    url: https://getsupport.atlassian.com
  description: Jira Software Cloud REST API documentation
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://atlassian.com/terms/
  title: Jira Software Cloud Sprint API
  version: 1001.0.0
servers:
- url: https://your-domain.atlassian.net
tags:
- description: Apis related to sprints
  name: Sprint
paths:
  /rest/agile/1.0/sprint:
    post:
      deprecated: false
      description: 'Creates a future sprint. Sprint name and origin board id are required. Start date, end date, and goal are optional.


        Note that the sprint name is trimmed. Also, when starting sprints from the UI, the "endDate" set through this call is ignored and instead the last sprint''s duration is used to fill the form.'
      operationId: createSprint
      requestBody:
        content:
          application/json:
            example:
              endDate: '2015-04-20T01:22:00.000+10:00'
              goal: sprint 1 goal
              name: sprint 1
              originBoardId: 5
              startDate: '2015-04-11T15:22:00.000+10:00'
            schema:
              additionalProperties: false
              properties:
                endDate:
                  type: string
                goal:
                  type: string
                name:
                  type: string
                originBoardId:
                  format: int64
                  type: integer
                startDate:
                  type: string
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              example: '{"id":37,"self":"https://your-domain.atlassian.net/rest/agile/1.0/sprint/23","state":"future","name":"sprint 1","startDate":"2015-04-11T15:22:00.000+10:00","endDate":"2015-04-20T01:22:00.000+10:00","originBoardId":5,"goal":"sprint 1 goal"}'
          description: Created sprint
        '400':
          description: Returned if the request is invalid.
        '401':
          description: Returned if the user is not logged in.
        '403':
          description: Returned if the user does not have a valid license.
        '404':
          description: Returned if the board does not exist or the user does not have permission to view it.
      security:
      - basicAuth: []
      - OAuth2:
        - write:sprint:jira-software
      summary: Create sprint
      tags:
      - Sprint
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: WRITE
  /rest/agile/1.0/sprint/{sprintId}:
    delete:
      deprecated: false
      description: Deletes a sprint. Once a sprint is deleted, all open issues in the sprint will be moved to the backlog.
      operationId: deleteSprint
      parameters:
      - description: The ID of the sprint to delete.
        in: path
        name: sprintId
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '204':
          description: Returned if the sprint was deleted successfully
        '401':
          description: Returned if the user is not logged in.
        '403':
          description: Returned if the user does not have a valid license or does not have permission to delete sprints.
        '404':
          description: Returned if the sprint does not exist.
      security:
      - basicAuth: []
      - OAuth2:
        - delete:sprint:jira-software
      summary: Delete sprint
      tags:
      - Sprint
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
      x-atlassian-connect-scope: DELETE
    get:
      deprecated: false
      description: Returns the sprint for a given sprint ID. The sprint will only be returned if the user can view the board that the sprint was created on, or view at least one of the issues in the sprint.
      operationId: getSprint
      parameters:
      - description: The ID of the requested sprint.
        in: path
        name: sprintId
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              example: '{"id":37,"self":"https://your-domain.atlassian.net/rest/agile/1.0/sprint/23","state":"closed","name":"sprint 1","startDate":"2015-04-11T15:22:00.000+10:00","endDate":"2015-04-20T01:22:00.000+10:00","completeDate":"2015-04-20T11:04:00.000+10:00","originBoardId":5,"goal":"sprint 1 goal"}'
          description: Returns the requested sprint.
        '401':
          description: Returned if the user is not logged in.
        '403':
          description: Returned if the user does not have a valid license.
        '404':
          description: Returned if the sprint does not exist or the user does not have permission to view it.
      security:
      - basicAuth: []
      - OAuth2:
        - read:sprint:jira-software
      summary: Get sprint
      tags:
      - Sprint
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: READ
    post:
      deprecated: false
      description: 'Performs a partial update of a sprint. A partial update means that fields not present in the request JSON will not be updated.


        Notes:


        * For closed sprints, only the name and goal can be updated; changes to other fields will be ignored.

        * A sprint can be started by updating the state to ''active''. This requires the sprint to be in the ''future'' state and have a startDate and endDate set.

        * A sprint can be completed by updating the state to ''closed''. This action requires the sprint to be in the ''active'' state. This sets the completeDate to the time of the request.

        * Other changes to state are not allowed.

        * The completeDate field cannot be updated manually.'
      operationId: partiallyUpdateSprint
      parameters:
      - description: The ID of the sprint to update.
        in: path
        name: sprintId
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            example:
              name: new name
            schema:
              additionalProperties: false
              properties:
                completeDate:
                  type: string
                createdDate:
                  type: string
                endDate:
                  type: string
                goal:
                  type: string
                id:
                  format: int64
                  type: integer
                name:
                  type: string
                originBoardId:
                  format: int64
                  type: integer
                self:
                  format: uri
                  type: string
                startDate:
                  type: string
                state:
                  type: string
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              example: '{"id":37,"self":"https://your-domain.atlassian.net/rest/agile/1.0/sprint/23","state":"closed","name":"sprint 1","startDate":"2015-04-11T15:22:00.000+10:00","endDate":"2015-04-20T01:22:00.000+10:00","completeDate":"2015-04-20T11:04:00.000+10:00","originBoardId":5,"goal":"sprint 1 goal"}'
          description: Updated sprint
        '400':
          description: Returned if the request is invalid.
        '401':
          description: Returned if the user is not logged in.
        '403':
          description: Returned if the user does not have a valid license.
        '404':
          description: Returned if the sprint does not exist.
      security:
      - basicAuth: []
      - OAuth2:
        - write:sprint:jira-software
      summary: Partially update sprint
      tags:
      - Sprint
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: WRITE
    put:
      deprecated: false
      description: 'Performs a full update of a sprint. A full update means that the result will be exactly the same as the request body. Any fields not present in the request JSON will be set to null.


        Notes:


        * For closed sprints, only the name and goal can be updated; changes to other fields will be ignored.

        * A sprint can be started by updating the state to ''active''. This requires the sprint to be in the ''future'' state and have a startDate and endDate set.

        * A sprint can be completed by updating the state to ''closed''. This action requires the sprint to be in the ''active'' state. This sets the completeDate to the time of the request.

        * Other changes to state are not allowed.

        * The completeDate field cannot be updated manually.'
      operationId: updateSprint
      parameters:
      - description: the ID of the sprint to update.
        in: path
        name: sprintId
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            example:
              completeDate: '2015-04-20T11:11:28.008+10:00'
              endDate: '2015-04-16T14:01:00.000+10:00'
              goal: sprint 1 goal
              name: sprint 1
              startDate: '2015-04-11T15:36:00.000+10:00'
              state: closed
            schema:
              additionalProperties: false
              properties:
                completeDate:
                  type: string
                createdDate:
                  type: string
                endDate:
                  type: string
                goal:
                  type: string
                id:
                  format: int64
                  type: integer
                name:
                  type: string
                originBoardId:
                  format: int64
                  type: integer
                self:
                  format: uri
                  type: string
                startDate:
                  type: string
                state:
                  type: string
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              example: '{"id":37,"self":"https://your-domain.atlassian.net/rest/agile/1.0/sprint/23","state":"closed","name":"sprint 1","startDate":"2015-04-11T15:22:00.000+10:00","endDate":"2015-04-20T01:22:00.000+10:00","completeDate":"2015-04-20T11:04:00.000+10:00","originBoardId":5,"goal":"sprint 1 goal"}'
          description: Updated sprint
        '400':
          description: Returned if the request is invalid.
        '401':
          description: Returned if the user is not logged in.
        '403':
          description: Returned if the user does not have a valid license.
        '404':
          description: Returned if the sprint does not exist.
      security:
      - basicAuth: []
      - OAuth2:
        - write:sprint:jira-software
      summary: Update sprint
      tags:
      - Sprint
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: WRITE
  /rest/agile/1.0/sprint/{sprintId}/issue:
    get:
      deprecated: true
      description: Returns all issues in a sprint, for a given sprint ID. This only includes issues that the user has permission to view. By default, the returned issues are ordered by rank.
      operationId: getIssuesForSprint
      parameters:
      - description: The ID of the sprint that contains the requested issues.
        in: path
        name: sprintId
        required: true
        schema:
          format: int64
          type: integer
      - description: 'The starting index of the returned issues. Base index: 0. See the ''Pagination'' section at the top of this page for more details.'
        in: query
        name: startAt
        schema:
          format: int64
          type: integer
      - description: The maximum number of issues to return per page. See the 'Pagination' section at the top of this page for more details. Note, the total number of issues returned is limited by the property 'jira.search.views.default.max' in your Jira instance. If you exceed this limit, your results will be truncated.
        in: query
        name: maxResults
        schema:
          format: int32
          type: integer
      - description: "Filters results using a JQL query. If you define an order in your JQL query, it will override the default order of the returned issues.  \nNote that `username` and `userkey` can't be used as search terms for this parameter due to privacy reasons. Use `accountId` instead."
        in: query
        name: jql
        schema:
          type: string
      - description: 'Specifies whether to validate the JQL query or not. Default: true.'
        in: query
        name: validateQuery
        schema:
          type: boolean
      - description: The list of fields to return for each issue. By default, all navigable and Agile fields are returned.
        in: query
        name: fields
        schema:
          items:
            additionalProperties: false
            type: object
          type: array
      - description: A comma-separated list of the parameters to expand.
        in: query
        name: expand
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"expand":"","fields":{"flagged":true,"sprint":{"id":37,"self":"https://your-domain.atlassian.net/rest/agile/1.0/sprint/13","state":"future","name":"sprint 2","goal":"sprint 2 goal"},"closedSprints":[{"id":37,"self":"https://your-domain.atlassian.net/rest/agile/1.0/sprint/23","state":"closed","name":"sprint 1","startDate":"2015-04-11T15:22:00.000+10:00","endDate":"2015-04-20T01:22:00.000+10:00","completeDate":"2015-04-20T11:04:00.000+10:00","goal":"sprint 1 goal"}],"description":"example bug report","project":{"avatarUrls":{"16x16":"https://your-domain.atlassian.net/secure/projectavatar?size=xsmall&pid=10000","24x24":"https://your-domain.atlassian.net/secure/projectavatar?size=small&pid=10000","32x32":"https://your-domain.atlassian.net/secure/projectavatar?size=medium&pid=10000","48x48":"https://your-domain.atlassian.net/secure/projectavatar?size=large&pid=10000"},"id":"10000","insight":{"lastIssueUpdateTime":"2021-04-22T05:37:05.000+0000","totalIssueCount":100},"key":"EX","name":"Example","projectCategory":{"description":"First Project Category","id":"10000","name":"FIRST","self":"https://your-domain.atlassian.net/rest/api/3/projectCategory/10000"},"self":"https://your-domain.atlassian.net/rest/api/3/project/EX","simplified":false,"style":"classic"},"comment":[{"author":{"accountId":"5b10a2844c20165700ede21g","active":false,"displayName":"Mia Krystof","self":"https://your-domain.atlassian.net/rest/api/3/user?accountId=5b10a2844c20165700ede21g"},"body":{"type":"doc","version":1,"content":[{"type":"paragraph","content":[{"type":"text","text":"Lorem ipsum dolor sit amet, consectetur adipiscing elit. Pellentesque eget venenatis elit. Duis eu justo eget augue iaculis fermentum. Sed semper quam laoreet nisi egestas at posuere augue semper."}]}]},"created":"2021-01-17T12:34:00.000+0000","id":"10000","self":"https://your-domain.atlassian.net/rest/api/3/issue/10010/comment/10000","updateAuthor":{"accountId":"5b10a2844c20165700ede21g","active":false,"displayName":"Mia Krystof","self":"https://your-domain.atlassian.net/rest/api/3/user?accountId=5b10a2844c20165700ede21g"},"updated":"2021-01-18T23:45:00.000+0000","visibility":{"identifier":"Administrators","type":"role","value":"Administrators"}}],"epic":{"id":37,"self":"https://your-domain.atlassian.net/rest/agile/1.0/epic/23","name":"epic 1","summary":"epic 1 summary","color":{"key":"color_4"},"done":true},"worklog":[{"author":{"accountId":"5b10a2844c20165700ede21g","active":false,"displayName":"Mia Krystof","self":"https://your-domain.atlassian.net/rest/api/3/user?accountId=5b10a2844c20165700ede21g"},"comment":{"type":"doc","version":1,"content":[{"type":"paragraph","content":[{"type":"text","text":"I did some work here."}]}]},"id":"100028","issueId":"10002","self":"https://your-domain.atlassian.net/rest/api/3/issue/10010/worklog/10000","started":"2021-01-17T12:34:00.000+0000","timeSpent":"3h 20m","timeSpentSeconds":12000,"updateAuthor":{"accountId":"5b10a2844c20165700ede21g","active":false,"displayName":"Mia Krystof","self":"https://your-domain.atlassian.net/rest/api/3/user?accountId=5b10a2844c20165700ede21g"},"updated":"2021-01-18T23:45:00.000+0000","visibility":{"identifier":"276f955c-63d7-42c8-9520-92d01dca0625","type":"group","value":"jira-developers"}}],"updated":1,"timetracking":{"originalEstimate":"10m","originalEstimateSeconds":600,"remainingEstimate":"3m","remainingEstimateSeconds":200,"timeSpent":"6m","timeSpentSeconds":400}},"id":"10001","key":"HSP-1","self":"https://your-domain.atlassian.net/rest/agile/1.0/board/92/issue/10001"}'
          description: Returns the requested issues, at the specified page of the results.
        '401':
          description: Returned if the user is not logged in.
        '403':
          description: Returned if the user does not have a valid license.
        '404':
          description: Returned if sprint does not exist or the user cannot view it.
      security:
      - basicAuth: []
      - OAuth2:
        - read:sprint:jira-software
        - read:issue-details:jira
        - read:jql:jira
      summary: Get issues for sprint
      tags:
      - Sprint
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
      x-atlassian-connect-scope: READ
    post:
      deprecated: false
      description: Moves issues to a sprint, for a given sprint ID. Issues can only be moved to open or active sprints. The maximum number of issues that can be moved in one operation is 50.
      operationId: moveIssuesToSprintAndRank
      parameters:
      - description: The ID of the sprint that you want to assign issues to.
        in: path
        name: sprintId
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            example:
              issues:
              - PR-1
              - '10001'
              - PR-3
              rankBeforeIssue: PR-4
              rankCustomFieldId: 10521
            schema:
              additionalProperties: false
              properties:
                issues:
                  items:
                    type: string
                  type: array
                rankAfterIssue:
                  type: string
                rankBeforeIssue:
                  type: string
                rankCustomFieldId:
                  format: int64
                  type: integer
              type: object
        required: true
      responses:
        '204':
          description: Empty response is returned if operation was successful.
        '400':
          description: Returned if the request is invalid.
        '401':
          description: Returned if the user is not logged in.
        '403':
          description: Returned if the user does not have a valid license or does not have permission to assign issues.
        '404':
          description: Returned if the sprint does not exist or the user does not have permission to view it.
      security:
      - basicAuth: []
      - OAuth2:
        - write:sprint:jira-software
      summary: Move issues to sprint and rank
      tags:
      - Sprint
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: WRITE
  /rest/software/1.0/sprint/{sprintId}/issue:
    get:
      deprecated: false
      description: Returns all issues in a sprint, for a given sprint ID. Result pagination is token based, using `nextPageToken` and `maxResults`. This only includes issues that the user has permission to view. Issues returned from this resource include Software project fields, like sprint, closedSprints, flagged, and epic. By default, the returned issues are ordered by rank.
      operationId: getIssuesForSprintJSIS
      parameters:
      - description: The ID of the sprint that contains the requested issues.
        in: path
        name: sprintId
        required: true
        schema:
          format: int64
          type: integer
      - description: 'The token for a page to fetch that is not the first page. The first page has a `nextPageToken` of `null`. Use the `nextPageToken` to fetch the next page of issues.


          Note: The `nextPageToken` field is **not included** in the response for the last page, indicating there is no next page.'
        in: query
        name: nextPageToken
        schema:
          type: string
      - description: The maximum number of items to return per page. To manage page size, the API may return fewer items per page where there is a large number of fields or properties returned. It returns max 5000 issues.
        in: query
        name: maxResults
        schema:
          format: int32
          type: integer
      - description: Strong consistency issue IDs to be reconciled with search results. Accepts max 50 IDs. This list of IDs should be consistent with each paginated request across different pages.
        in: query
        name: reconcileIssues
        schema:
          items:
            format: int64
            type: integer
          type: array
          uniqueItems: true
      - description: "Filters results using a JQL query. If you define an order in your JQL query, it will override the default order of the returned issues.  \nNote that `username` and `userkey` can't be used as search terms for this parameter due to privacy reasons. Use `accountId` instead."
        in: query
        name: jql
        schema:
          type: string
      - description: 'Specifies whether to validate the JQL query or not. Default: true.'
        in: query
        name: validateQuery
        schema:
          type: boolean
      - description: The list of fields to return for each issue. By default, all navigable and Software project fields are returned.
        in: query
        name: fields
        schema:
          items:
            additionalProperties: false
            type: object
          type: array
      - description: A comma-separated list of the parameters to expand.
        in: query
        name: expand
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
