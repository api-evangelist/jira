                            description: A message supplied in the case of an error.
                        commits:
                          type: array
                          description: Commits errors
                          items:
                            title: EntityError
                            type: object
                            required:
                            - id
                            properties:
                              id:
                                type: string
                                description: Entity id
                              errorMessages:
                                type: array
                                description: Error message
                                items:
