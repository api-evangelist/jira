                      description: Represents errors related to a particular repository and its entities
                  unknownIssueKeys:
                    type: array
                    description: 'Issue keys that are not known on this Jira instance (if any). These may be invalid keys (e.g. `UTF-8` is sometimes incorrectly identified as a Jira issue key), or they may be for projects that no longer exist. If a devinfo entity has been associated with issue keys other than those in this array it will still be stored against those valid keys. '
                    items:
                      type: string
                  unknownAssociations:
                    description: 'Associations that are not known on this Jira instance (if any).


                      These may be invalid keys (e.g. `UTF-8` is sometimes incorrectly identified as a Jira issue key), or they may be for projects that no longer exist.


                      If a development information entity has been associated with any other association other than those in this array it will still be stored against those valid associations.

                      If a development information entity was only associated with the associations in this array, it is deemed to be invalid and it won''t be persisted.

                      '
                    type: array
