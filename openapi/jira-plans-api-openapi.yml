openapi: 3.2.0
info:
  contact:
    email: ecosystem@atlassian.com
  description: Jira Cloud platform REST API documentation
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://developer.atlassian.com/platform/marketplace/atlassian-developer-terms/
  title: Jira Cloud platform REST Plans API
  version: 1001.0.0-SNAPSHOT-82b018affa468e58f284fbe4df33536469d757df
servers:
- url: https://your-domain.atlassian.net
tags:
- description: This resource represents plans. Use it to get, create, duplicate, update, trash and archive plans.
  name: Plans
paths:
  /rest/api/3/plans/plan:
    get:
      deprecated: false
      description: 'Returns a paginated list of plans.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: getPlans
      parameters:
      - description: Whether to include trashed plans in the results.
        in: query
        name: includeTrashed
        schema:
          default: false
          type: boolean
      - description: Whether to include archived plans in the results.
        in: query
        name: includeArchived
        schema:
          default: false
          type: boolean
      - description: The cursor to start from. If not provided, the first page will be returned.
        in: query
        name: cursor
        schema:
          default: ''
          type: string
      - description: The maximum number of plans to return per page. The maximum value is 50. The default value is 50.
        in: query
        name: maxResults
        schema:
          default: 50
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              example: '{"cursor":"","isLast":true,"maxResults":2,"nextPageCursor":"2","total":10,"values":[{"id":"100","issueSources":[{"type":"Project","value":10000}],"name":"Plan 1","scenarioId":"200","status":"Active"},{"id":"200","issueSources":[{"type":"Board","value":20000}],"name":"Plan 2","scenarioId":"300","status":"Trashed"}]}'
              schema:
                $ref: '#/components/schemas/PageWithCursorGetPlanResponseForPage'
          description: Returned if the request is successful.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user is not logged in.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the site has no premium edition of Jira or if the user does not have the Administer Jira global permission.
      security:
      - basicAuth: []
      - OAuth2:
        - read:jira-work
      summary: Get plans paginated
      tags:
      - Plans
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
    post:
      deprecated: false
      description: 'Creates a plan.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: createPlan
      parameters:
      - description: Whether to accept group IDs instead of group names. Group names are deprecated.
        in: query
        name: useGroupId
        schema:
          default: false
          type: boolean
      requestBody:
        content:
          application/json:
            example:
              crossProjectReleases:
              - name: AB and BC merge
                releaseIds:
                - 29
                - 39
              customFields:
              - customFieldId: 2335
                filter: true
              exclusionRules:
                issueIds:
                - 2
                - 3
                issueTypeIds:
                - 32
                - 33
                numberOfDaysToShowCompletedIssues: 50
                releaseIds:
                - 42
                - 43
                workStatusCategoryIds:
                - 22
                - 23
                workStatusIds:
                - 12
                - 13
              issueSources:
              - type: Project
                value: 12
              - type: Board
                value: 462
              leadAccountId: abc-12-rbji
              name: ABC Quaterly plan
              permissions:
              - holder:
                  type: AccountId
                  value: 234-tgj-343
                type: Edit
              scheduling:
                dependencies: Sequential
                endDate:
                  type: DueDate
                estimation: Days
                inferredDates: ReleaseDates
                startDate:
                  type: TargetStartDate
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                format: int64
                type: integer
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user is not logged in.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the site has no premium edition of Jira or if the user does not have the Administer Jira global permission.
      security:
      - basicAuth: []
      - OAuth2:
        - write:jira-work
      summary: Create plan
      tags:
      - Plans
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/plans/plan/{planId}:
    get:
      deprecated: false
      description: 'Returns a plan.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: getPlan
      parameters:
      - description: The ID of the plan.
        in: path
        name: planId
        required: true
        schema:
          format: int64
          type: integer
      - description: Whether to return group IDs instead of group names. Group names are deprecated.
        in: query
        name: useGroupId
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              example: '{"crossProjectReleases":[{"name":"x-plr","releaseIds":[345]}],"customFields":[{"customFieldId":34,"filter":false},{"customFieldId":39,"filter":true}],"exclusionRules":{"issueIds":[1,2],"issueTypeIds":[13,23],"numberOfDaysToShowCompletedIssues":50,"releaseIds":[14,24],"workStatusCategoryIds":[12,22],"workStatusIds":[11,21]},"id":23,"issueSources":[{"type":"Project","value":12},{"type":"Filter","value":10293}],"lastSaved":"2024-10-03T10:15:30Z","leadAccountId":"628f5e86d5ec1f006ne7363x2s","name":"Onset TBJ Plan","permissions":[{"holder":{"type":"AccountId","value":"04jekw86d5jjje006ne7363x2s"},"type":"Edit"}],"scheduling":{"dependencies":"Concurrent","endDate":{"dateCustomFieldId":1098,"type":"DateCustomField"},"estimation":"Hours","inferredDates":"ReleaseDates","startDate":{"type":"TargetStartDate"}},"status":"Active"}'
              schema:
                $ref: '#/components/schemas/GetPlanResponse'
          description: Returned if the request is successful.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user is not logged in.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the site has no premium edition of Jira or if the user does not have the Administer Jira global permission.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the plan is not found.
      security:
      - basicAuth: []
      - OAuth2:
        - read:jira-work
      summary: Get plan
      tags:
      - Plans
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
    put:
      deprecated: false
      description: 'Updates any of the following details of a plan using JSON Patch.


        * name

        * leadAccountId

        * scheduling


        * estimation with StoryPoints, Days or Hours as possible values

        * startDate


        * type with DueDate, TargetStartDate, TargetEndDate or DateCustomField as possible values

        * dateCustomFieldId

        * endDate


        * type with DueDate, TargetStartDate, TargetEndDate or DateCustomField as possible values

        * dateCustomFieldId

        * inferredDates with None, SprintDates or ReleaseDates as possible values

        * dependencies with Sequential or Concurrent as possible values

        * issueSources


        * type with Board, Project or Filter as possible values

        * value

        * exclusionRules


        * numberOfDaysToShowCompletedIssues

        * issueIds

        * workStatusIds

        * workStatusCategoryIds

        * issueTypeIds

        * releaseIds

        * crossProjectReleases


        * name

        * releaseIds

        * customFields


        * customFieldId

        * filter

        * permissions


        * type with View or Edit as possible values

        * holder


        * type with Group or AccountId as possible values

        * value


        **Permissions required:** *Administer Jira* global permission.


        *Note that "add" operations do not respect array indexes in target locations. Call the "Get plan" endpoint to find out the order of array elements.*'
      operationId: updatePlan
      parameters:
      - description: The ID of the plan.
        in: path
        name: planId
        required: true
        schema:
          format: int64
          type: integer
      - description: Whether to accept group IDs instead of group names. Group names are deprecated.
        in: query
        name: useGroupId
        schema:
          default: false
          type: boolean
      requestBody:
        content:
          application/json-patch+json:
            example: '[{"op": "replace", "path": "/scheduling/estimation", "value": "Days"}]

              '
            schema:
              type: object
        required: true
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user is not logged in.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the site has no premium edition of Jira or if the user does not have the Administer Jira global permission.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the plan is not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the plan is not active.
      security:
      - basicAuth: []
      - OAuth2:
        - write:jira-work
      summary: Update plan
      tags:
      - Plans
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/plans/plan/{planId}/archive:
    put:
      deprecated: false
      description: 'Archives a plan.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: archivePlan
      parameters:
      - description: The ID of the plan.
        in: path
        name: planId
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: Returned if the request is successful.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user is not logged in.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the site has no premium edition of Jira or if the user does not have the Administer Jira global permission.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the plan is not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the plan is not active.
      security:
      - basicAuth: []
      - OAuth2:
        - write:jira-work
      summary: Archive plan
      tags:
      - Plans
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/plans/plan/{planId}/duplicate:
    post:
      deprecated: false
      description: 'Duplicates a plan.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: duplicatePlan
      parameters:
      - description: The ID of the plan.
        in: path
        name: planId
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            example:
              name: Copied Plan
            schema:
              $ref: '#/components/schemas/DuplicatePlanRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                format: int64
                type: integer
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user is not logged in.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the site has no premium edition of Jira or if the user does not have the Administer Jira global permission.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the plan to duplicate is not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the plan to duplicate is not active.
      security:
      - basicAuth: []
      - OAuth2:
        - write:jira-work
      summary: Duplicate plan
      tags:
      - Plans
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/plans/plan/{planId}/trash:
    put:
      deprecated: false
      description: 'Moves a plan to trash.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: trashPlan
      parameters:
      - description: The ID of the plan.
        in: path
        name: planId
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: Returned if the request is successful.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user is not logged in.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the site has no premium edition of Jira or if the user does not have the Administer Jira global permission.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the plan is not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the plan is not active.
      security:
      - basicAuth: []
      - OAuth2:
        - write:jira-work
      summary: Trash plan
      tags:
      - Plans
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
components:
  schemas:
    DuplicatePlanRequest:
      additionalProperties: false
      properties:
        name:
          description: The plan name.
          type: string
      required:
      - name
      type: object
    GetCustomFieldResponse:
      additionalProperties: false
      properties:
        customFieldId:
          description: The custom field ID.
          format: int64
          type: integer
        filter:
          description: Allows filtering issues based on their values for the custom field.
          type: boolean
      required:
      - customFieldId
      type: object
    GetPermissionResponse:
      additionalProperties: false
      properties:
        holder:
          allOf:
          - $ref: '#/components/schemas/GetPermissionHolderResponse'
          description: The permission holder.
        type:
          description: The permission type. This is "View" or "Edit".
          enum:
          - View
          - Edit
          type: string
      required:
      - holder
      - type
      type: object
    GetDateFieldResponse:
      additionalProperties: false
      properties:
        dateCustomFieldId:
          description: A date custom field ID. This is returned if the type is "DateCustomField".
          format: int64
          type: integer
        type:
          description: The date field type. This is "DueDate", "TargetStartDate", "TargetEndDate" or "DateCustomField".
          enum:
          - DueDate
          - TargetStartDate
          - TargetEndDate
          - DateCustomField
          type: string
      required:
      - type
      type: object
    GetPlanResponse:
      additionalProperties: false
      properties:
        crossProjectReleases:
          description: The cross-project releases included in the plan.
          items:
            $ref: '#/components/schemas/GetCrossProjectReleaseResponse'
          type: array
        customFields:
          description: The custom fields for the plan.
          items:
            $ref: '#/components/schemas/GetCustomFieldResponse'
          type: array
        exclusionRules:
          allOf:
          - $ref: '#/components/schemas/GetExclusionRulesResponse'
          description: The exclusion rules for the plan.
        id:
          description: The plan ID.
          format: int64
          type: integer
        issueSources:
          description: The issue sources included in the plan.
          items:
            $ref: '#/components/schemas/GetIssueSourceResponse'
          type: array
        lastSaved:
          description: The date when the plan was last saved in UTC.
          type: string
        leadAccountId:
          description: The account ID of the plan lead.
          type: string
        name:
          description: The plan name.
          type: string
        permissions:
          description: The permissions for the plan.
          items:
            $ref: '#/components/schemas/GetPermissionResponse'
          type: array
        scheduling:
          allOf:
          - $ref: '#/components/schemas/GetSchedulingResponse'
          description: The scheduling settings for the plan.
        status:
          description: The plan status. This is "Active", "Trashed" or "Archived".
          enum:
          - Active
          - Trashed
          - Archived
          type: string
      required:
      - id
      - scheduling
      - status
      type: object
    CreateCrossProjectReleaseRequest:
      additionalProperties: false
      properties:
        name:
          description: The cross-project release name.
          type: string
        releaseIds:
          description: The IDs of the releases to include in the cross-project release.
          items:
            format: int64
            type: integer
          type: array
          uniqueItems: true
      required:
      - name
      type: object
    CreateExclusionRulesRequest:
      additionalProperties: false
      properties:
        issueIds:
          description: The IDs of the issues to exclude from the plan.
          items:
            format: int64
            type: integer
          type: array
          uniqueItems: true
        issueTypeIds:
          description: The IDs of the issue types to exclude from the plan.
          items:
            format: int64
            type: integer
          type: array
          uniqueItems: true
        numberOfDaysToShowCompletedIssues:
          description: Issues completed this number of days ago will be excluded from the plan.
          format: int32
          type: integer
        releaseIds:
          description: The IDs of the releases to exclude from the plan.
          items:
            format: int64
            type: integer
          type: array
          uniqueItems: true
        workStatusCategoryIds:
          description: The IDs of the work status categories to exclude from the plan.
          items:
            format: int64
            type: integer
          type: array
          uniqueItems: true
        workStatusIds:
          description: The IDs of the work statuses to exclude from the plan.
          items:
            format: int64
            type: integer
          type: array
          uniqueItems: true
      type: object
    PageWithCursorGetPlanResponseForPage:
      additionalProperties: false
      properties:
        cursor:
          type: string
        last:
          type: boolean
        nextPageCursor:
          type: string
        size:
          format: int32
          type: integer
        total:
          format: int64
          type: integer
        values:
          items:
            $ref: '#/components/schemas/GetPlanResponseForPage'
          type: array
      type: object
    CreatePermissionHolderRequest:
      additionalProperties: false
      properties:
        type:
          description: The permission holder type. This must be "Group" or "AccountId".
          enum:
          - Group
          - AccountId
          type: string
        value:
          description: The permission holder value. This must be a group name if the type is "Group" or an account ID if the type is "AccountId".
          type: string
      required:
      - type
      - value
      type: object
    GetExclusionRulesResponse:
      additionalProperties: false
      properties:
        issueIds:
          description: The IDs of the issues excluded from the plan.
          items:
            format: int64
            type: integer
          type: array
          uniqueItems: true
        issueTypeIds:
          description: The IDs of the issue types excluded from the plan.
          items:
            format: int64
            type: integer
          type: array
          uniqueItems: true
        numberOfDaysToShowCompletedIssues:
          description: Issues completed this number of days ago are excluded from the plan.
          format: int32
          type: integer
        releaseIds:
          description: The IDs of the releases excluded from the plan.
          items:
            format: int64
            type: integer
          type: array
          uniqueItems: true
        workStatusCategoryIds:
          description: The IDs of the work status categories excluded from the plan.
          items:
            format: int64
            type: integer
          type: array
          uniqueItems: true
        workStatusIds:
          description: The IDs of the work statuses excluded from the plan.
          items:
            format: int64
            type: integer
          type: array
          uniqueItems: true
      required:
      - numberOfDaysToShowCompletedIssues
      type: object
    CreateSchedulingRequest:
      additionalProperties: false
      properties:
        dependencies:
          description: The dependencies for the plan. This must be "Sequential" or "Concurrent".
          enum:
          - Sequential
          - Concurrent
          type: string
        endDate:
          allOf:
          - $ref: '#/components/schemas/CreateDateFieldRequest'
          description: The end date field for the plan.
        estimation:
          description: The estimation unit for the plan. This must be "StoryPoints", "Days" or "Hours".
          enum:
          - StoryPoints
          - Days
          - Hours
          type: string
        inferredDates:
          description: The inferred dates for the plan. This must be "None", "SprintDates" or "ReleaseDates".
          enum:
          - None
          - SprintDates
          - ReleaseDates
          type: string
        startDate:
          allOf:
          - $ref: '#/components/schemas/CreateDateFieldRequest'
          description: The start date field for the plan.
      required:
      - estimation
      type: object
    GetSchedulingResponse:
      additionalProperties: false
      properties:
        dependencies:
          description: The dependencies for the plan. This is "Sequential" or "Concurrent".
          enum:
          - Sequential
          - Concurrent
          type: string
        endDate:
          allOf:
          - $ref: '#/components/schemas/GetDateFieldResponse'
          description: The end date field for the plan.
        estimation:
          description: The estimation unit for the plan. This is "StoryPoints", "Days" or "Hours".
          enum:
          - StoryPoints
          - Days
          - Hours
          type: string
        inferredDates:
          description: The inferred dates for the plan. This is "None", "SprintDates" or "ReleaseDates".
          enum:
          - None
          - SprintDates
          - ReleaseDates
          type: string
        startDate:
          allOf:
          - $ref: '#/components/schemas/GetDateFieldResponse'
          description: The start date field for the plan.
      required:
      - dependencies
      - endDate
      - estimation
      - inferredDates
      - startDate
      type: object
    CreatePermissionRequest:
      additionalProperties: false
      properties:
        holder:
          allOf:
          - $ref: '#/components/schemas/CreatePermissionHolderRequest'
          description: The permission holder.
        type:
          description: The permission type. This must be "View" or "Edit".
          enum:
          - View
          - Edit
          type: string
      required:
      - holder
      - type
      type: object
    GetIssueSourceResponse:
      additionalProperties: false
      properties:
        type:
          description: The issue source type. This is "Board", "Project" or "Filter".
          enum:
          - Board
          - Project
          - Filter
          - Custom
          type: string
        value:
          description: The issue source value. This is a board ID if the type is "Board", a project ID if the type is "Project" or a filter ID if the type is "Filter".
          format: int64
          type: integer
      required:
      - type
      - value
      type: object
    GetPermissionHolderResponse:
      additionalProperties: false
      properties:
        type:
          description: The permission holder type. This is "Group" or "AccountId".
          enum:
          - Group
          - AccountId
          type: string
        value:
          description: The permission holder value. This is a group name if the type is "Group" or an account ID if the type is "AccountId".
          type: string
      required:
      - type
      - value
      type: object
    CreateIssueSourceRequest:
      additionalProperties: false
      properties:
        type:
          description: The issue source type. This must be "Board", "Project" or "Filter".
          enum:
          - Board
          - Project
          - Filter
          type: string
        value:
          description: The issue source value. This must be a board ID if the type is "Board", a project ID if the type is "Project" or a filter ID if the type is "Filter".
          format: int64
          type: integer
      required:
      - type
      - value
      type: object
    CreateDateFieldRequest:
      additionalProperties: false
      properties:
        dateCustomFieldId:
          description: A date custom field ID. This is required if the type is "DateCustomField".
          format: int64
          type: integer
        type:
          description: The date field type. This must be "DueDate", "TargetStartDate", "TargetEndDate" or "DateCustomField".
          enum:
          - DueDate
          - TargetStartDate
          - TargetEndDate
          - DateCustomField
          type: string
      required:
      - type
      type: object
    ErrorCollection:
      additionalProperties: false
      description: Error messages from an operation.
      properties:
        errorMessages:
          description: The list of error messages produced by this operation. For example, "input parameter 'key' must be provided"
          items:
            type: string
          type: array
        errors:
          additionalProperties:
            type: string
          description: 'The list of errors by parameter returned by the operation. For example,"projectKey": "Project keys must start with an uppercase letter, followed by one or more uppercase alphanumeric characters."'
          type: object
        status:
          format: int32
          type: integer
      type: object
    CreateCustomFieldRequest:
      additionalProperties: false
      properties:
        customFieldId:
          description: The custom field ID.
          format: int64
          type: integer
        filter:
          description: Allows filtering issues based on their values for the custom field.
          type: boolean
      required:
      - customFieldId
      type: object
    GetPlanResponseForPage:
      additionalProperties: false
      properties:
        id:
          description: The plan ID.
          type: string
        issueSources:
          description: The issue sources included in the plan.
          items:
            $ref: '#/components/schemas/GetIssueSourceResponse'
          type: array
          uniqueItems: true
        name:
          description: The plan name.
          type: string
        scenarioId:
          description: Default scenario ID.
          type: string
        status:
          description: The plan status. This is "Active", "Trashed" or "Archived".
          enum:
          - Active
          - Trashed
          - Archived
          type: string
      required:
      - id
      - name
      - scenarioId
      - status
      type: object
    CreatePlanRequest:
      additionalProperties: false
      properties:
        crossProjectReleases:
          description: The cross-project releases to include in the plan.
          items:
            $ref: '#/components/schemas/CreateCrossProjectReleaseRequest'
          type: array
          uniqueItems: true
        customFields:
          description: The custom fields for the plan.
          items:
            $ref: '#/components/schemas/CreateCustomFieldRequest'
          type: array
          uniqueItems: true
        exclusionRules:
          allOf:
          - $ref: '#/components/schemas/CreateExclusionRulesRequest'
          description: The exclusion rules for the plan.
        issueSources:
          description: The issue sources to include in the plan.
          items:
            $ref: '#/components/schemas/CreateIssueSourceRequest'
          type: array
          uniqueItems: true
        leadAccountId:
          description: The account ID of the plan lead.
          type: string
        name:
          description: The plan name.
          maxLength: 255
          minLength: 1
          type: string
        permissions:
          description: The permissions for the plan.
          items:
            $ref: '#/components/schemas/CreatePermissionRequest'
          type: array
          uniqueItems: true
        scheduling:
          allOf:
          - $ref: '#/components/schemas/CreateSchedulingRequest'
          description: The scheduling settings for the plan.
      required:
      - issueSources
      - name
      - scheduling
      type: object
    GetCrossProjectReleaseResponse:
      additionalProperties: false
      properties:
        name:
          description: The cross-project release name.
          type: string
        releaseIds:
          description: The IDs of the releases included in the cross-project release.
          items:
            format: int64
            type: integer
          type: array
          uniqueItems: true
      type: object
