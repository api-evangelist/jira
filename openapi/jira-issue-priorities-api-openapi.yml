openapi: 3.2.0
info:
  title: Jira Issue Priorities API
  x-refined-note:
  - x-atlassian-api-version differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Issue Priorities across 2 of this provider''s published API definitions: jira-cloud-platform-rest-api-openapi.yml, jira-platform-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{domain}.atlassian.net/rest/api/3
  description: Jira Cloud instance
  variables:
    domain:
      description: Your Jira Cloud site subdomain (e.g., your-company).
      default: your-domain
- url: https://your-domain.atlassian.net
tags:
- name: Issue Priorities
  description: Retrieve issue priority levels.
paths:
  /priority:
    get:
      summary: Jira Get Priorities
      description: Returns the list of all issue priorities.
      operationId: getPriorities
      tags:
      - Issue Priorities
      externalDocs:
        description: API method documentation
        url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issue-priorities/#api-rest-api-3-priority-get
      responses:
        '200':
          description: Priorities returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Priority'
              examples:
                Getpriorities200Example:
                  summary: Default getPriorities 200 response
                  x-microcks-default: true
                  value:
                  - self: https://www.example.com
                    id: abc123
                    name: Example Title
                    description: A sample description.
                    iconUrl: https://www.example.com
                    statusColor: example_value
        '401':
          description: Authentication credentials are missing or invalid.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oauth2: []
      - bearerAuth: []
    servers:
    - url: https://{domain}.atlassian.net/rest/api/3
      description: Jira Cloud instance
      variables:
        domain:
          description: Your Jira Cloud site subdomain (e.g., your-company).
          default: your-domain
  /rest/api/3/priority:
    get:
      deprecated: true
      description: 'Returns the list of all issue priorities.


        **Deprecated:** Use Search priorities instead. **Permissions required:** Permission to access Jira.'
      operationId: getPriorities
      parameters: []
      responses:
        '200':
          content:
            application/json:
              example: '[{"description":"Major loss of function.","iconUrl":"https://your-domain.atlassian.net/images/icons/priorities/major.png","id":"1","name":"Major","self":"https://your-domain.atlassian.net/rest/api/3/priority/3","statusColor":"#009900"},{"description":"Very little impact.","iconUrl":"https://your-domain.atlassian.net/images/icons/priorities/trivial.png","id":"2","name":"Trivial","self":"https://your-domain.atlassian.net/rest/api/3/priority/5","statusColor":"#cfcfcf"}]'
              schema:
                items:
                  $ref: '#/components/schemas/Priority_2'
                type: array
          description: Returned if the request is successful.
        '401':
          description: Returned if the authentication credentials are incorrect.
      security:
      - basicAuth: []
      - OAuth2:
        - read:jira-work
      - {}
      summary: Get priorities
      tags:
      - Issue Priorities
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - read:jira-work
        state: Current
      - scheme: OAuth2
        scopes:
        - read:priority:jira
        state: Beta
      x-changes:
      - announced: '2022-10-11'
        details: https://developer.atlassian.com/cloud/jira/platform/changelog/#CHANGE-762
        effective: '2023-04-11'
        type: removed
      x-atlassian-connect-scope: READ
    post:
      deprecated: false
      description: 'Creates an issue priority.


        **Deprecation notice:** The `iconUrl` parameter was sunset on 16th Mar 2025, and replaced with `avatarId`. See CHANGE-1525.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: createPriority
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              description: My priority description
              iconUrl: /images/icons/priorities/major.png
              name: My new priority
              statusColor: '#ABCDEF'
            schema:
              $ref: '#/components/schemas/CreatePriorityDetails'
        required: true
      responses:
        '201':
          content:
            application/json:
              example: '{"id":"10001"}'
              schema:
                $ref: '#/components/schemas/PriorityId'
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["The length of the description must not exceed 255 characters."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the request isn't valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              example: '{"errorMessages":["Only Jira administrators can access issue type screen schemes."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user doesn't have the necessary permission.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Create priority
      tags:
      - Issue Priorities
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: INACCESSIBLE
    servers:
    - url: https://your-domain.atlassian.net
  /rest/api/3/priority/default:
    put:
      deprecated: false
      description: 'Sets default issue priority.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: setDefaultPriority
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              id: '3'
            schema:
              $ref: '#/components/schemas/SetDefaultPriorityRequest'
        required: true
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["The id has to be provided."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the request isn't valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              example: '{"errorMessages":["You are not authorized to perform this action. Administrator privileges are required."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user doesn't have the necessary permission.
        '404':
          content:
            application/json:
              example: '{"errorMessages":["Priority with ID 10000 not found."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the issue priority isn't found.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Set default priority
      tags:
      - Issue Priorities
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: INACCESSIBLE
    servers:
    - url: https://your-domain.atlassian.net
  /rest/api/3/priority/move:
    put:
      deprecated: false
      description: 'Changes the order of issue priorities.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: movePriorities
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              after: '10003'
              ids:
              - '10004'
              - '10005'
            schema:
              $ref: '#/components/schemas/ReorderIssuePriorities'
        required: true
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["The ids must contain no more than 1,000 items."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the request isn't valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              example: '{"errorMessages":["You are not authorized to perform this action. Administrator privileges are required."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user doesn't have the necessary permission.
        '404':
          content:
            application/json:
              example: '{"errorMessages":["Priority with ID 10000 not found."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the issue priority isn't found.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Move priorities
      tags:
      - Issue Priorities
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: INACCESSIBLE
    servers:
    - url: https://your-domain.atlassian.net
  /rest/api/3/priority/search:
    get:
      deprecated: false
      description: 'Returns a paginated list of priorities. The list can contain all priorities or a subset determined by any combination of these criteria:


        * a list of priority IDs. Any invalid priority IDs are ignored.

        * a list of project IDs. Only priorities that are available in these projects will be returned. Any invalid project IDs are ignored.

        * whether the field configuration is a default. This returns priorities from company-managed (classic) projects only, as there is no concept of default priorities in team-managed projects.


        **Deprecation notice:** The `onlyDefault` parameter is deprecated and will be removed at a later date. See CHANGE-1655.


        **Deprecation notice:** The `isDefault` property of priorities is deprecated and will be removed at a later date. See CHANGE-1655.


        **Permissions required:** Permission to access Jira.'
      operationId: searchPriorities
      parameters:
      - description: The index of the first item to return in a page of results (page offset).
        in: query
        name: startAt
        schema:
          default: '0'
          type: string
      - description: The maximum number of items to return per page.
        in: query
        name: maxResults
        schema:
          default: '50'
          type: string
      - description: The list of priority IDs. To include multiple IDs, provide an ampersand-separated list. For example, `id=2&id=3`.
        in: query
        name: id
        schema:
          items:
            default: ''
            type: string
          type: array
      - description: The list of projects IDs. To include multiple IDs, provide an ampersand-separated list. For example, `projectId=10010&projectId=10111`.
        in: query
        name: projectId
        schema:
          items:
            default: ''
            type: string
          type: array
      - description: The name of priority to search for.
        in: query
        name: priorityName
        schema:
          default: ''
          type: string
      - description: Whether only the default priority is returned.
        in: query
        name: onlyDefault
        schema:
          default: false
          type: boolean
        x-changes:
        - announced: '2024-05-22'
          details: https://developer.atlassian.com/cloud/jira/platform/changelog/#CHANGE-1655
          effective: '2024-11-22'
          type: removed
      - description: Use `schemes` to return the associated priority schemes for each priority. Limited to returning first 15 priority schemes per priority.
        in: query
        name: expand
        schema:
          default: ''
          type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":true,"maxResults":50,"startAt":0,"total":2,"values":[{"description":"Major loss of function.","iconUrl":"https://your-domain.atlassian.net/images/icons/priorities/major.png","id":"1","isDefault":true,"name":"Major","self":"https://your-domain.atlassian.net/rest/api/3/priority/3","statusColor":"#009900"},{"description":"Very little impact.","iconUrl":"https://your-domain.atlassian.net/images/icons/priorities/trivial.png","id":"2","isDefault":false,"name":"Trivial","self":"https://your-domain.atlassian.net/rest/api/3/priority/5","statusColor":"#cfcfcf"}]}'
              schema:
                $ref: '#/components/schemas/PageBeanPriority'
          description: Returned if the request is successful.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the authentication credentials are incorrect or missing.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Search priorities
      tags:
      - Issue Priorities
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: READ
    servers:
    - url: https://your-domain.atlassian.net
  /rest/api/3/priority/{id}:
    delete:
      deprecated: false
      description: 'Deletes an issue priority.


        This operation is asynchronous. Follow the `location` link in the response to determine the status of the task and use Get task to obtain subsequent updates.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: deletePriority
      parameters:
      - description: The ID of the issue priority.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '303':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskProgressBeanObject'
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["The newPriority has to be provided."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the request isn't valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              example: '{"errorMessages":["You are not authorized to perform this action. Administrator privileges are required."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user doesn't have the necessary permission.
        '404':
          content:
            application/json:
              example: '{"errorMessages":["Priority with ID 10000 not found."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the issue priority isn't found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if a task to delete the issue priority is already running.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Delete priority
      tags:
      - Issue Priorities
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-changes:
      - announced: '2023-07-18'
        details: https://developer.atlassian.com/changelog/#CHANGE-1067
        effective: '2024-05-24'
        type: removed
      x-atlassian-connect-scope: INACCESSIBLE
    get:
      deprecated: false
      description: 'Returns an issue priority. To fetch multiple priorities at once, use Search priorities instead.


        **Permissions required:** Permission to access Jira.'
      operationId: getPriority
      parameters:
      - description: The ID of the issue priority.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example: '{"description":"Major loss of function.","iconUrl":"https://your-domain.atlassian.net/images/icons/priorities/major.png","id":"1","name":"Major","self":"https://your-domain.atlassian.net/rest/api/3/priority/3","statusColor":"#009900"}'
              schema:
                $ref: '#/components/schemas/Priority_2'
          description: Returned if the request is successful.
        '401':
          description: Returned if the authentication credentials are incorrect.
        '404':
          description: Returned if the issue priority isn't found.
      security:
      - basicAuth: []
      - OAuth2:
        - read:jira-work
      - {}
      summary: Get priority
      tags:
      - Issue Priorities
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - read:jira-work
        state: Current
      - scheme: OAuth2
        scopes:
        - read:priority:jira
        state: Beta
      x-atlassian-connect-scope: READ
    put:
      deprecated: false
      description: 'Updates an issue priority.


        At least one request body parameter must be defined.


        **Deprecation notice:** The `iconUrl` parameter was sunset on 16th Mar 2025, and replaced with `avatarId`. See CHANGE-1525.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: updatePriority
      parameters:
      - description: The ID of the issue priority.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              description: My updated priority description
              iconUrl: /images/icons/priorities/minor.png
              name: My updated priority
              statusColor: '#123456'
            schema:
              $ref: '#/components/schemas/UpdatePriorityDetails'
        required: true
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: Returned if the request is successful.
        '400':
          content:
            application/json:
              example: '{"errorMessages":["The length of the description must not exceed 255 characters."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the request isn't valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              example: '{"errorMessages":["You are not authorized to perform this action. Administrator privileges are required."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the user doesn't have the necessary permission.
        '404':
          content:
            application/json:
              example: '{"errorMessages":["Priority with ID 10000 not found."],"errors":{}}'
              schema:
                $ref: '#/components/schemas/ErrorCollection'
          description: Returned if the issue priority isn't found.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Update priority
      tags:
      - Issue Priorities
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: INACCESSIBLE
    servers:
    - url: https://your-domain.atlassian.net
components:
  schemas:
    Priority:
      type: object
      description: An issue priority.
      properties:
        self:
          type: string
          format: uri
          example: https://www.example.com
        id:
          type: string
          example: abc123
        name:
          type: string
          description: The name of the priority (e.g., Highest, High, Medium, Low, Lowest).
          example: Example Title
        description:
          type: string
          example: A sample description.
        iconUrl:
          type: string
          format: uri
          example: https://www.example.com
        statusColor:
          type: string
          description: The color associated with the priority.
          example: example_value
    ErrorCollection:
      additionalProperties: false
      description: Error messages from an operation.
      properties:
        errorMessages:
          description: The list of error messages produced by this operation. For example, "input parameter 'key' must be provided"
          items:
            type: string
          type: array
        errors:
          additionalProperties:
            type: string
          description: 'The list of errors by parameter returned by the operation. For example,"projectKey": "Project keys must start with an uppercase letter, followed by one or more uppercase alphanumeric characters."'
          type: object
        status:
          format: int32
          type: integer
      type: object
    UpdatePriorityDetails:
      additionalProperties: true
      description: Details of an issue priority.
      properties:
        avatarId:
          description: The ID for the avatar for the priority. This parameter is nullable and both iconUrl and avatarId cannot be defined.
          format: int64
          type: integer
          writeOnly: true
        description:
          description: The description of the priority.
          maxLength: 255
          type:
          - string
          - 'null'
          writeOnly: true
        iconUrl:
          description: The URL of an icon for the priority. Accepted protocols are HTTP and HTTPS. Built in icons can also be used. Both iconUrl and avatarId cannot be defined.
          enum:
          - /images/icons/priorities/blocker.png
          - /images/icons/priorities/critical.png
          - /images/icons/priorities/high.png
          - /images/icons/priorities/highest.png
          - /images/icons/priorities/low.png
          - /images/icons/priorities/lowest.png
          - /images/icons/priorities/major.png
          - /images/icons/priorities/medium.png
          - /images/icons/priorities/minor.png
          - /images/icons/priorities/trivial.png
          - /images/icons/priorities/blocker_new.png
          - /images/icons/priorities/critical_new.png
          - /images/icons/priorities/high_new.png
          - /images/icons/priorities/highest_new.png
          - /images/icons/priorities/low_new.png
          - /images/icons/priorities/lowest_new.png
          - /images/icons/priorities/major_new.png
          - /images/icons/priorities/medium_new.png
          - /images/icons/priorities/minor_new.png
          - /images/icons/priorities/trivial_new.png
          maxLength: 255
          type:
          - string
          - 'null'
          writeOnly: true
        name:
          description: The name of the priority. Must be unique.
          maxLength: 60
          type:
          - string
          - 'null'
          writeOnly: true
        statusColor:
          description: The status color of the priority in 3-digit or 6-digit hexadecimal format.
          type:
          - string
          - 'null'
          writeOnly: true
      type: object
    PriorityId:
      additionalProperties: true
      description: The ID of an issue priority.
      properties:
        id:
          description: The ID of the issue priority.
          readOnly: true
          type: string
      required:
      - id
      type: object
    PageBeanPriority:
      additionalProperties: false
      description: A page of items.
      properties:
        isLast:
          description: Whether this is the last page.
          readOnly: true
          type: boolean
        maxResults:
          description: The maximum number of items that could be returned.
          format: int32
          readOnly: true
          type: integer
        nextPage:
          description: If there is another page of results, the URL of the next page.
          format: uri
          readOnly: true
          type: string
        self:
          description: The URL of the page.
          format: uri
          readOnly: true
          type: string
        startAt:
          description: The index of the first item returned.
          format: int64
          readOnly: true
          type: integer
        total:
          description: The number of items returned.
          format: int64
          readOnly: true
          type: integer
        values:
          description: The list of items.
          items:
            $ref: '#/components/schemas/Priority_2'
          readOnly: true
          type: array
      type: object
    TaskProgressBeanObject:
      additionalProperties: false
      description: Details about a task.
      properties:
        description:
          description: The description of the task.
          type: string
        elapsedRuntime:
          description: The execution time of the task, in milliseconds.
          format: int64
          type: integer
        finished:
          description: A timestamp recording when the task was finished.
          format: int64
          type: integer
        id:
          description: The ID of the task.
          type: string
        lastUpdate:
          description: A timestamp recording when the task progress was last updated.
          format: int64
          type: integer
        message:
          description: Information about the progress of the task.
          type: string
        progress:
          description: The progress of the task, as a percentage complete.
          format: int64
          type: integer
        result:
          description: The result of the task execution.
        self:
          description: The URL of the task.
          format: uri
          type: string
        started:
          description: A timestamp recording when the task was started.
          format: int64
          type: integer
        status:
          description: The status of the task.
          enum:
          - ENQUEUED
          - RUNNING
          - COMPLETE
          - FAILED
          - CANCEL_REQUESTED
          - CANCELLED
          - DEAD
          type: string
        submitted:
          description: A timestamp recording when the task was submitted.
          format: int64
          type: integer
        submittedBy:
          description: The ID of the user who submitted the task.
          format: int64
          type: integer
      required:
      - elapsedRuntime
      - id
      - lastUpdate
      - progress
      - self
      - status
      - submitted
      - submittedBy
      type: object
    Priority_2:
      additionalProperties: true
      description: An issue priority.
      properties:
        avatarId:
          description: The avatarId of the avatar for the issue priority. This parameter is nullable and when set, this avatar references the universal avatar APIs.
          format: int64
          type: integer
        description:
          description: The description of the issue priority.
          type: string
        iconUrl:
          description: The URL of the icon for the issue priority.
          type: string
        id:
          description: The ID of the issue priority.
          type: string
        isDefault:
          description: Whether this priority is the default.
          type: boolean
        name:
          description: The name of the issue priority.
          type: string
        schemes:
          allOf:
          - $ref: '#/components/schemas/ExpandPrioritySchemePage'
