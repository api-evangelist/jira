openapi: 3.2.0
info:
  contact:
    email: ecosystem@atlassian.com
  description: Jira Cloud platform REST API documentation
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://developer.atlassian.com/platform/marketplace/atlassian-developer-terms/
  title: Jira Cloud platform REST Field schemes API
  version: 1001.0.0-SNAPSHOT-82b018affa468e58f284fbe4df33536469d757df
servers:
- url: https://your-domain.atlassian.net
tags:
- description: 'This resource represents field schemes which are replacing field configuration schemes to control field associations. They are currently in beta and only available to customers who have opted-in to the beta program. For more information see RFC-103: Jira Field Configuration Overhaul: Admin Experience and API Changes'
  name: Field schemes
paths:
  /rest/api/3/config/fieldschemes:
    get:
      deprecated: false
      description: 'REST endpoint for retrieving a paginated list of field association schemes with optional filtering.


        This endpoint allows clients to fetch field association schemes with optional filtering by project IDs and text queries. The response includes scheme details with navigation links and filter metadata when applicable.


        Filtering Behavior:


        * When projectId or query parameters are provided, the response includes matchedFilters metadata showing which filters were applied.

        * When no filters are applied, matchedFilters is omitted from individual scheme objects


        **Permissions required:** *Administer Jira* global permission.'
      operationId: getFieldAssociationSchemes
      parameters:
      - description: (optional) List of project IDs to filter schemes by. If not provided, schemes from all projects are returned.
        in: query
        name: projectId
        schema:
          items:
            format: int64
            type: integer
          type: array
      - description: (optional) Text filter for scheme name or description matching (case-insensitive). If not provided, no text filtering is applied.
        in: query
        name: query
        schema:
          type: string
      - description: 'Zero-based index of the first item to return (default: 0)'
        in: query
        name: startAt
        schema:
          default: 0
          format: int64
          type: integer
      - description: 'Maximum number of items to return per page (default: 50, max: 100)'
        in: query
        name: maxResults
        schema:
          default: 50
          format: int32
          maximum: 100
          type: integer
      responses:
        '200':
          content:
            application/json:
              example: '{"description":"Field Association Scheme test description","fieldsCount":5,"id":1000,"isDefault":false,"links":{"associations":"rest/api/3/config/fieldschemes/10000/fields","projects":"rest/api/3/config/fieldschemes/10000/projects"},"matchedFilters":{"projectIds":[10001,10002],"query":"query"},"name":"Field Association Scheme test name"}'
              schema:
                $ref: '#/components/schemas/PageBean2GetFieldAssociationSchemeResponse'
          description: Pagianted list of field association schemes
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollections'
          description: Returned if the request parameters are invalid (e.g., negative startAt, maxResults exceeding limit).
        '401':
          content:
            application/json:
              schema: {}
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              schema: {}
          description: Returned if the user does not have the required permissions.
        '404':
          content:
            application/json:
              schema: {}
          description: Returned if the feature flag is disabled.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Get field schemes
      tags:
      - Field schemes
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - read:field-configuration-scheme:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
    post:
      deprecated: false
      description: 'Endpoint for creating a new field association scheme.


        A new scheme is **not** copied from, or based on, any existing field association scheme. Instead, it is initialised with a minimal default set of critical fields sourced from the instance''s own *system* and *product* fields (the fields returned by the product''s field API), rather than from a scheme you specify.


        To create a scheme that is based on an existing one, use the *Clone field scheme* endpoint instead.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: createFieldAssociationScheme
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              description: Field association scheme description
              name: Field association scheme name
            schema:
              $ref: '#/components/schemas/CreateFieldAssociationSchemeRequest'
        description: The request containing the name and description of the field association scheme
        required: true
      responses:
        '200':
          content:
            application/json:
              example: '{"description":"Field association scheme description","id":10000,"links":{"associations":"{BASE_API_URL}/rest/api/2/config/fieldschemes/9/fields","projects":"{BASE_API_URL}/rest/api/2/config/fieldschemes/9/projects"},"name":"Field association scheme name"}'
              schema:
                $ref: '#/components/schemas/CreateFieldAssociationSchemeResponse'
          description: Returned if the creation was successful.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollections'
          description: Returned if the request is invalid. If request is malformed, returns a collection of errors.
        '401':
          content:
            application/json:
              schema: {}
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              schema: {}
          description: Returned if the user does not have the required permissions
        '404':
          content:
            application/json:
              schema: {}
          description: Returned if the feature flag is disabled or the scheme ID is not found.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Create field scheme
      tags:
      - Field schemes
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:field-configuration-scheme:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/config/fieldschemes/fields:
    delete:
      deprecated: false
      description: 'Remove fields associated with field association schemes.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: removeFieldsAssociatedWithSchemes
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              customfield_10000:
                schemeIds:
                - 10000
                - 10001
              customfield_10001:
                schemeIds:
                - 10002
            schema:
              additionalProperties:
                $ref: '#/components/schemas/RemoveFieldAssociationsRequestItem'
              type: object
        description: The request containing the schemes and fields to be removed.
        required: true
      responses:
        '200':
          content:
            application/json:
              example: '{"results":[{"fieldId":"customfield_10000","schemeId":10000,"success":true},{"fieldId":"customfield_10001","schemeId":10002,"success":true}]}'
              schema:
                $ref: '#/components/schemas/MinimalFieldSchemeToFieldsResponse'
          description: Returned if the field association update was successful.
        '204':
          content:
            application/json:
              schema: {}
          description: The request completed successfully. No additional content will be sent in the response.
        '207':
          content:
            application/json:
              example: '{"results":[{"fieldId":"customfield_10000","schemeId":10000,"success":true},{"error":"Scheme 10001 doesn''t exist","fieldId":"customfield_10001","schemeId":10001,"success":false}]}'
              schema:
                $ref: '#/components/schemas/MinimalFieldSchemeToFieldsResponse'
          description: Returned if the field association update was partially successful.
        '400':
          content:
            application/json:
              example: '{"results":[{"error":"Scheme 99999 doesn''t exist","fieldId":"customfield_10000","schemeId":99999,"success":false},{"error":"Field invalid_field doesn''t exist","fieldId":"invalid_field","schemeId":10001,"success":false}]}'
              schema:
                $ref: '#/components/schemas/MinimalFieldSchemeToFieldsResponse'
          description: Returned if the request is invalid. If request is malformed, returns a collection of errors. If request is well-formed but contains invalid scheme or field IDs, returns failure details.
        '401':
          content:
            application/json:
              schema: {}
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              schema: {}
          description: Returned if the user does not have the required permissions
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Remove fields associated with field schemes
      tags:
      - Field schemes
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:field-configuration:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
    put:
      deprecated: false
      description: 'Update fields associated with field association schemes.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: updateFieldsAssociatedWithSchemes
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              customfield_10000:
              - restrictedToWorkTypes:
                - 1
                - 2
                schemeIds:
                - 10000
                - 10001
              customfield_10001:
              - schemeIds:
                - 10002
            schema:
              additionalProperties:
                items:
                  $ref: '#/components/schemas/UpdateFieldAssociationsRequestItem'
                type: array
              type: object
        description: The request containing the schemes and work types to associate each field with.
        required: true
      responses:
        '200':
          content:
            application/json:
              example: '{"results":[{"fieldId":"customfield_10000","schemeId":10000,"success":true,"workTypeIds":[1,2]},{"fieldId":"customfield_10001","schemeId":10002,"success":true,"workTypeIds":[]}]}'
              schema:
                $ref: '#/components/schemas/FieldSchemeToFieldsResponse'
          description: Returned if the field association update was successful.
        '204':
          content:
            application/json:
              schema: {}
          description: The request completed successfully. No additional content will be sent in the response.
        '207':
          content:
            application/json:
              example: '{"results":[{"fieldId":"customfield_10000","schemeId":10000,"success":true,"workTypeIds":[1]},{"error":"Scheme 10001 doesn''t exist","fieldId":"customfield_10001","schemeId":10001,"success":false,"workTypeIds":[2]}]}'
              schema:
                $ref: '#/components/schemas/FieldSchemeToFieldsResponse'
          description: Returned if the field association update was partially successful.
        '400':
          content:
            application/json:
              example: '{"results":[{"error":"Scheme 99999 doesn''t exist","fieldId":"customfield_10000","schemeId":99999,"success":false,"workTypeIds":[]},{"error":"Scheme 10001 doesn''t exist","fieldId":"invalid_field","schemeId":10001,"success":false,"workTypeIds":[]}]}'
              schema:
                $ref: '#/components/schemas/FieldSchemeToFieldsResponse'
          description: Returned if the request is invalid. If request is malformed, returns a collection of errors. If request is well-formed but contains invalid scheme or field IDs, returns failure details.
        '401':
          content:
            application/json:
              schema: {}
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              schema: {}
          description: Returned if the user does not have the required permissions
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Update fields associated with field schemes
      tags:
      - Field schemes
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:field-configuration:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/config/fieldschemes/fields/parameters:
    delete:
      deprecated: false
      description: 'Remove field association parameters overrides for work types.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: removeFieldAssociationSchemeItemParameters
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              customfield_10000:
              - parameters:
                - description
                - isRequired
                schemeId: 10000
                workTypeIds:
                - 1
                - 2
              description:
              - parameters:
                - description
                schemeId: 10001
                workTypeIds:
                - 3
            schema:
              additionalProperties:
                items:
                  $ref: '#/components/schemas/ParameterRemovalDetails'
                type: array
              type: object
        required: true
      responses:
        '200':
          description: Returned if the removal was successful.
        '204':
          content:
            application/json:
              schema: {}
          description: The request completed successfully. No additional content will be sent in the response.
        '207':
          content:
            application/json:
              example: '{"results":[{"error":{"code":"FIELD_IS_NOT_ASSOCIATED","message":"The field ''customfield_10000'' is not associated with the scheme ''10000''."},"fieldId":"customfield_10000","schemeId":10000,"success":false,"workTypeIds":[1,2]},{"fieldId":"description","schemeId":10001,"success":true,"workTypeIds":[3]}]}'
              schema:
                $ref: '#/components/schemas/RemoveFieldParametersResult'
          description: Returned if the removal was partially successful.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollections'
          description: Returned if the request is invalid. If request is malformed, returns a collection of errors. If request is well-formed but contains invalid scheme or project IDs, returns failure details.
        '401':
          content:
            application/json:
              schema: {}
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              schema: {}
          description: Returned if the user does not have the required permissions
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Remove field parameters
      tags:
      - Field schemes
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:field-configuration:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
    put:
      deprecated: false
      description: 'Update field association item parameters in field association schemes.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: updateFieldAssociationSchemeItemParameters
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              customfield_10000:
              - parameters:
                  description: Field description
                  isRequired: true
                  rendererType: atlassian-wiki-renderer
                schemeIds:
                - 10000
                - 10001
                workTypeParameters:
                - description: Description for Bug
                  isRequired: false
                  rendererType: jira-text-renderer
                  workTypeId: 10002
              customfield_10001:
              - schemeIds:
                - 10001
                workTypeParameters:
                - description: Description for Bug
                  isRequired: false
                  workTypeId: 10002
                - description: Description for Task
                  isRequired: true
                  rendererType: atlassian-wiki-renderer
                  workTypeId: 10003
            schema:
              additionalProperties:
                items:
                  $ref: '#/components/schemas/UpdateFieldSchemeParametersRequest'
                type: array
              type: object
        description: The request containing the field association scheme id and the parameters to update.
        required: true
      responses:
        '200':
          content:
            application/json:
              example: '{"results":[{"fieldId":"customfield_10000","schemeId":10000,"success":true},{"fieldId":"customfield_10001","schemeId":10002,"success":true,"workTypeId":10001}]}'
              schema:
                $ref: '#/components/schemas/UpdateFieldSchemeParametersResponse'
          description: Returned if the field parameter update was successful.
        '204':
          content:
            application/json:
              schema: {}
          description: The request completed successfully. No additional content will be sent in the response.
        '207':
          content:
            application/json:
              example: '{"results":[{"fieldId":"customfield_10000","schemeId":10000,"success":true},{"error":"Scheme 10001 doesn''t exist","fieldId":"customfield_10001","schemeId":10001,"success":false,"workTypeId":10001}]}'
              schema:
                $ref: '#/components/schemas/UpdateFieldSchemeParametersResponse'
          description: Returned if the field parameter update was partially successful.
        '400':
          content:
            application/json:
              example: '{"results":[{"error":"Scheme 99999 doesn''t exist","fieldId":"customfield_10000","schemeId":99999,"success":false},{"error":"Scheme 10001 doesn''t exist","fieldId":"invalid_field","schemeId":10001,"success":false}]}'
              schema:
                $ref: '#/components/schemas/UpdateFieldSchemeParametersResponse'
          description: Returned if the request is invalid. If request is malformed, returns a collection of errors. If request is well-formed but contains invalid scheme or field IDs, returns failure details.
        '401':
          content:
            application/json:
              schema: {}
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              schema: {}
          description: Returned if the user does not have the required permissions
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Update field parameters
      tags:
      - Field schemes
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:field-configuration:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/config/fieldschemes/projects:
    get:
      deprecated: false
      description: 'Get projects with field association schemes. This will be a temporary API but useful when transitioning from the legacy field configuration APIs to the new ones.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: getProjectsWithFieldSchemes
      parameters:
      - description: 'The starting index of the returned projects. Base index: 0.'
        in: query
        name: startAt
        schema:
          default: 0
          format: int64
          type: integer
      - description: The maximum number of projects to return per page, maximum allowed value is 100.
        in: query
        name: maxResults
        schema:
          default: 50
          format: int32
          maximum: 100
          type: integer
      - description: List of project ids to filter the results by.
        in: query
        name: projectId
        required: true
        schema:
          items:
            format: int64
            type: integer
          type: array
      responses:
        '200':
          content:
            application/json:
              example: '{"isLast":true,"maxResults":3,"startAt":0,"total":3,"values":[{"projectId":10000,"schemeId":1},{"projectId":10001,"schemeId":1},{"projectId":10002,"schemeId":2}]}'
              schema:
                $ref: '#/components/schemas/PageBean2GetProjectsWithFieldSchemesResponse'
          description: Returns the list of project with field association schemes.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollections'
          description: Returned if the request is invalid.
        '401':
          content:
            application/json:
              schema: {}
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              schema: {}
          description: Returned if the user does not have the required permissions.
        '404':
          content:
            application/json:
              schema: {}
          description: Returned if the feature flag is disabled.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Get projects with field schemes
      tags:
      - Field schemes
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - read:field-configuration-scheme:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
    put:
      deprecated: false
      description: 'Associate projects to field association schemes.


        **Permissions required:** *Administer Jira* global permission.'
      operationId: associateProjectsToFieldAssociationSchemes
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              '10000':
                projectIds:
                - 10000
                - 10001
              '10001':
                projectIds:
                - 10002
            schema:
              additionalProperties:
                $ref: '#/components/schemas/FieldSchemeToProjectsRequest'
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              example: '{"results":[{"projectId":10001,"schemeId":10000,"success":true},{"projectId":10002,"schemeId":10001,"success":true}]}'
              schema:
                $ref: '#/components/schemas/FieldSchemeToProjectsResponse'
          description: Returned if the association was successful.
        '204':
          content:
            application/json:
              schema: {}
          description: The request completed successfully. No additional content will be sent in the response.
        '207':
          content:
            application/json:
              example: '{"results":[{"projectId":10001,"schemeId":10000,"success":true},{"error":"Project #10001 doesn''t exist","projectId":10002,"schemeId":10001,"success":false}]}'
              schema:
                $ref: '#/components/schemas/FieldSchemeToProjectsResponse'
          description: Returned if the association was partially successful.
        '400':
          content:
            application/json:
              example: '{"results":[{"error":"Field scheme #10000 doesn''t exist","projectId":10001,"schemeId":10000,"success":false},{"error":"Project #10001 doesn''t exist","projectId":10002,"schemeId":10001,"success":false}]}'
              schema:
                $ref: '#/components/schemas/FieldSchemeToProjectsResponse'
          description: Returned if the request is invalid. If request is malformed, returns a collection of errors. If request is well-formed but contains invalid scheme or project IDs, returns failure details.
        '401':
          content:
            application/json:
              schema: {}
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              schema: {}
          description: Returned if the user does not have the required permissions
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Associate projects to field schemes
      tags:
      - Field schemes
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:field-configuration:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
  /rest/api/3/config/fieldschemes/{id}:
    delete:
      deprecated: false
      description: 'Delete a specified field association scheme


        **Permissions required:** *Administer Jira* global permission.'
      operationId: deleteFieldAssociationScheme
      parameters:
      - description: The ID of the field association scheme to delete.
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              example: '{"deleted":true,"id":"10000"}'
              schema:
                $ref: '#/components/schemas/DeleteFieldAssociationSchemeResponse'
          description: Returned if the field association scheme deletion was successful.
        '400':
          content:
            application/json:
              schema: {}
          description: Returned if the scheme that the user is attempting to delete is a system scheme.
        '401':
          content:
            application/json:
              schema: {}
          description: Returned if the authentication credentials are incorrect or missing.
        '403':
          content:
            application/json:
              schema: {}
          description: Returned if the user does not have the required permissions
        '404':
          content:
            application/json:
              schema: {}
          description: Return if the provided ID does not match any existing field association scheme
        '409':
          content:
            application/json:
              schema: {}
          description: Return if the scheme that the user is attempting to delete is still in use.
      security:
      - basicAuth: []
      - OAuth2:
        - manage:jira-configuration
      summary: Delete a field scheme
      tags:
      - Field schemes
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-oauth2-scopes:
      - scheme: OAuth2
        scopes:
        - manage:jira-configuration
        state: Current
      - scheme: OAuth2
        scopes:
        - write:field-configuration-scheme:jira
        state: Beta
      x-experimental: true
      x-atlassian-connect-scope: INACCESSIBLE
    get:
      deprecated: false
      description: 'Endpoint for fetching a field association scheme by its ID


        **Permissions required:** *Administer Jira* global permission.'
      operationId: getFieldAssociationSchemeById
      parameters:
      - description: The scheme id to fetch
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              example: '{"description":"This is a field association scheme","fieldsCount":5,"id":"123","isDefault":false,"links":{"associations":"rest/api/3/config/fieldschemes/10000/fields","projects":"rest/api/3/config/fieldschemes/10000/projects"},"name":"Scheme"}'
              schema:
                $ref: '#/components/schemas/GetFieldAssociationSchemeByIdResponse'
          description: Returned if a field association scheme matches the given scheme ID
        '403':
          content:
